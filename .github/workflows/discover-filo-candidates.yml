name: Persian-first Filo trend scout # expanded source sweep

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"
  push:
    paths:
      - ".github/workflows/discover-filo-candidates.yml"
      - "scripts/platform_scout.cjs"
      - "scripts/merge_short_candidates.cjs"
      - "scripts/license_check.cjs"
      - "config/content-policy.json"

permissions:
  contents: write

concurrency:
  group: goushibaaz-trend-state-writers
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install browser discovery
        run: |
          npm init -y
          npm install --no-save playwright aparat.js
          node -e "const {Aparat}=require('aparat.js'); if(typeof Aparat!=='function') process.exit(1)"
          node --check scripts/platform_scout.cjs
          node --check scripts/license_check.cjs
          npx playwright install --with-deps chromium
      - name: Render and collect public Persian Shorts metadata
        run: |
          mkdir -p out state
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');
          (async () => {
            const MANUAL_SOURCES = [
              {key:'memento-studios', base:'https://mediafarsi.com/channel/memento-studios', language:'persian', context:'ولاگ و سرگرمی'},
              {key:'mikikalafe', base:'https://mediafarsi.com/channel/mikikalafe', language:'persian', context:'سرگرمی و طنز'},
              {key:'mehdi-jahaan', base:'https://mediafarsi.com/channel/mehdi-jahaan', language:'persian', context:'سرگرمی و طنز'},
              {key:'chizomiz', base:'https://mediafarsi.com/channel/chizomiz', language:'persian', context:'پادکست و سرگرمی'},
              {key:'fasteris', base:'https://mediafarsi.com/channel/fasteris', language:'persian', context:'سرگرمی و چالش'},
              {key:'mrnoon', base:'https://mediafarsi.com/channel/mrnoon', language:'persian', context:'گیمینگ فارسی'},
              {key:'tpm-top-persian-movies', base:'https://mediafarsi.com/channel/tpm-top-persian-movies', language:'persian', context:'فیلم و سریال فارسی'},
              {key:'khotan', base:'https://mediafarsi.com/channel/khotan', language:'persian', context:'لایف استایل و ولاگ'},
              {key:'amootheory', base:'https://mediafarsi.com/channel/amootheory', language:'persian', context:'سرگرمی و طنز'},
              {key:'kouman', base:'https://mediafarsi.com/channel/kouman', language:'persian', context:'سرگرمی و طنز'},
              {key:'nikshah-zone', base:'https://mediafarsi.com/channel/nikshah-zone', language:'persian', context:'لایف استایل'},
              {key:'sahar-hoc', base:'https://mediafarsi.com/channel/sahar-hoc', language:'persian', context:'لایف استایل و طنز'},
              {key:'mehran-magnet', base:'https://mediafarsi.com/channel/mehran-magnet', language:'persian', context:'سرگرمی'},
              {key:'nikshah', base:'https://mediafarsi.com/channel/nikshah', language:'persian', context:'لایف استایل'},
              {key:'loco', base:'https://mediafarsi.com/channel/loco', language:'persian', context:'سرگرمی و طنز و چالش'},
              {key:'hamed-shahanii', base:'https://mediafarsi.com/channel/hamed-shahanii', language:'persian', context:'طنز و چالش'},
              {key:'amirhoseynghiasi', base:'https://mediafarsi.com/channel/amirhoseynghiasi', language:'persian', context:'سرگرمی و طنز'},
              {key:'pouyan-nr', base:'https://mediafarsi.com/channel/pouyan-nr', language:'persian', context:'سرگرمی و طنز'},
              {key:'farshad-silent', base:'https://mediafarsi.com/channel/farshad-silent', language:'persian', context:'سرگرمی و طنز'},
              {key:'sogang', base:'https://mediafarsi.com/channel/sogang', language:'persian', context:'سرگرمی و طنز'},
              {key:'poriya-west', base:'https://mediafarsi.com/channel/poriya-west', language:'persian', context:'سرگرمی و طنز'},
              {key:'madgal', base:'https://mediafarsi.com/channel/madgal', language:'persian', context:'سرگرمی و طنز'},
              {key:'the-beniamin', base:'https://mediafarsi.com/channel/the-beniamin', language:'persian', context:'سرگرمی و طنز'},
              {key:'benyamin-be', base:'https://mediafarsi.com/channel/benyamin-be', language:'persian', context:'لایف استایل'},
              {key:'vigiland', base:'https://mediafarsi.com/channel/vigiland', language:'persian', context:'چالش'},
              {key:'serna-amini', base:'https://mediafarsi.com/channel/serna-amini', language:'persian', context:'طنز و کمدی'},
              {key:'amirgzed', base:'https://mediafarsi.com/channel/amirgzed', language:'persian', context:'سرگرمی'},
              {key:'itsnilu', base:'https://mediafarsi.com/channel/itsnilu', language:'persian', context:'سرگرمی'},
              {key:'farhadxray', base:'https://mediafarsi.com/channel/farhadxray', language:'persian', context:'ولاگ'},
              {key:'digcheh', base:'https://mediafarsi.com/channel/digcheh', language:'persian', context:'آشپزی'},
              {key:'sooriland', base:'https://mediafarsi.com/channel/sooriland', language:'persian', context:'انیمیشن و طنز'},
              {key:'zigzalplus', base:'https://mediafarsi.com/channel/zigzalplus', language:'persian', context:'کلیپ کوتاه و سرگرمی'},
              {key:'film-bin', base:'https://mediafarsi.com/channel/film-binz', language:'persian', context:'کلیپ طنز و سریال'}
            ];
            const INDEX_PAGES = [
              'https://mediafarsi.com/',
              'https://mediafarsi.com/top-youtubers',
              'https://mediafarsi.com/most-viewed',
              'https://mediafarsi.com/new-channels',
              'https://mediafarsi.com/persian-youtube-statistics',
              'https://mediafarsi.com/sitemap.xml',
              'https://mediafarsi.com/sitemap_index.xml'
            ];
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({
              userAgent:'Mozilla/5.0 (compatible; GoushibaazTrendScout/1.0; public-metadata-only)',
              locale:'fa-IR'
            });
            const cleanIndexText = value => String(value || '').replace(/\s+/g,' ').trim();
            const sourcePriority = source => {
              const text = cleanIndexText([source.key, source.context, source.label].join(' ')).toLowerCase();
              let score = 0;
              if (/سرگرمی|طنز|کمدی|خنده|چالش|واکنش|ری.?اکشن|دوربین مخفی|prank|comedy|entertainment/.test(text)) score += 12;
              if (/حیوان|گربه|سگ|آشپزی|غذا|سفر|دانستنی|فکت|علم|ترفند|گیمینگ|بازی|ورزش|خودرو|تکنولوژی|گجت|life.?style|gaming|food|travel|facts|animals/.test(text)) score += 4;
              if (/موسیقی|آهنگ|مداحی|خبر|سیاست|سیاسی|جنگ|انتخابات|music|news|politic/.test(text)) score -= 5;
              if (/کانال|فارسی|ایرانی|ایران/.test(text)) score += 2;
              return score;
            };
            async function inspectIndexPage(url) {
              const page = await context.newPage();
              page.setDefaultTimeout(7000);
              try {
                await page.goto(url, {waitUntil:'domcontentloaded', timeout:15000});
                await page.waitForTimeout(120);
                return await page.evaluate(() => {
                  const clean = s => (s || '').replace(/\s+/g,' ').trim();
                  const channelLinks = [];
                  const categoryLinks = [];
                  const sitemapLinks = [];
                  const seenChannels = new Set();
                  const seenCategories = new Set();
                  const seenSitemaps = new Set();
                  function collectUrl(rawUrl, label, context) {
                    let u;
                    try { u = new URL(rawUrl, location.origin); } catch { return; }
                    if (u.hostname !== 'mediafarsi.com' && u.hostname !== 'www.mediafarsi.com') return;
                    const href = u.pathname.replace(/\/$/,'');
                    const cleanLabel = clean(label || href.split('/').filter(Boolean).pop() || '');
                    const cleanContext = clean(context || cleanLabel).slice(0,800);
                    const match = href.match(/^\/channel\/([A-Za-z0-9_-]+)$/i);
                    if (match && !seenChannels.has(match[1].toLowerCase())) {
                      seenChannels.add(match[1].toLowerCase());
                      channelLinks.push({key:match[1], base:'https://mediafarsi.com'+href, label:cleanLabel, context:cleanContext, language:'persian', indexPage:location.href});
                    }
                    if (/^\/(?:categories?|category)\//i.test(href) || /category|categories/i.test(u.search)) {
                      if (!seenCategories.has(u.toString())) {
                        seenCategories.add(u.toString());
                        categoryLinks.push({url:u.toString(), label:cleanLabel, context:cleanContext});
                      }
                    }
                    if (/sitemap[^/]*\.xml$/i.test(u.pathname) && u.toString() !== location.href && !seenSitemaps.has(u.toString())) {
                      seenSitemaps.add(u.toString());
                      sitemapLinks.push({url:u.toString(), label:cleanLabel, context:cleanContext});
                    }
                  }
                  for (const a of document.querySelectorAll('a[href]')) {
                    const label = clean(a.innerText || a.getAttribute('aria-label') || (a.querySelector('img') || {}).alt || '');
                    const card = a.closest('tr, article, li, [class*="card"], [class*="item"]') || a.parentElement?.parentElement || a;
                    collectUrl(a.href, label, clean(card.innerText || label));
                  }
                  // XML sitemaps expose all-channel URLs as <loc> elements instead of anchors.
                  for (const loc of document.querySelectorAll('loc')) collectUrl(loc.textContent, loc.textContent, 'MediaFarsi sitemap');
                  return {url:location.href, title:document.title, channelLinks, categoryLinks, sitemapLinks};
                });
              } catch (error) {
                return {url, error:String(error.message || error).slice(0,150), channelLinks:[], categoryLinks:[]};
              } finally { await page.close().catch(()=>{}); }
            }
            async function inspectSourcesWithLimit(items, limit, fn) {
              const queue = [...items];
              const outputs = [];
              async function worker() {
                while (queue.length) {
                  const item = queue.shift();
                  if (!item) continue;
                  outputs.push(await fn(item));
                }
              }
              await Promise.all(Array.from({length:Math.min(limit,items.length)}, () => worker()));
              return outputs;
            }
            const firstLevel = await inspectSourcesWithLimit(INDEX_PAGES, 7, inspectIndexPage);
            const firstSitemapTargets = [...new Set(firstLevel.flatMap(result => (result.sitemapLinks || []).map(item => item.url)))].slice(0,100);
            const sitemapLevelOne = await inspectSourcesWithLimit(firstSitemapTargets, 8, inspectIndexPage);
            const secondSitemapTargets = [...new Set(sitemapLevelOne.flatMap(result => (result.sitemapLinks || []).map(item => item.url)))]
              .filter(url => !firstSitemapTargets.includes(url) && !INDEX_PAGES.includes(url)).slice(0,150);
            const sitemapLevelTwo = await inspectSourcesWithLimit(secondSitemapTargets, 8, inspectIndexPage);
            const indexResults = [...firstLevel, ...sitemapLevelOne, ...sitemapLevelTwo];
            const categoryMap = new Map();
            const channelMap = new Map(MANUAL_SOURCES.map(source => [source.base.toLowerCase(), {...source, sourceIndex:'manual-seed'}]));
            for (const result of indexResults) {
              for (const source of result.channelLinks || []) {
                const old = channelMap.get(source.base.toLowerCase());
                if (!old || sourcePriority(source) > sourcePriority(old)) channelMap.set(source.base.toLowerCase(), source);
              }
              for (const category of result.categoryLinks || []) {
                if (/طنز|سرگرمی|کمدی|چالش|گیم|غذا|آشپزی|حیوان|فکت|دانش|سفر|ویدیو|entertain|comedy|gaming|food|animal|fact|travel/i.test(category.label+' '+category.context+' '+category.url)) {
                  categoryMap.set(category.url, category);
                }
              }
            }
            const categoryPages = [...categoryMap.values()].sort((a,b)=>sourcePriority(b)-sourcePriority(a)).slice(0,150);
            const secondLevel = await inspectSourcesWithLimit(categoryPages, 10, category => inspectIndexPage(category.url));
            for (const result of secondLevel) {
              for (const source of result.channelLinks || []) {
                const old = channelMap.get(source.base.toLowerCase());
                if (!old || sourcePriority(source) > sourcePriority(old)) channelMap.set(source.base.toLowerCase(), source);
              }
            }
            const allSources = [...channelMap.values()].sort((a,b)=>sourcePriority(b)-sourcePriority(a) || a.key.localeCompare(b.key));
            const coreSources = allSources.slice(0,100);
            const rotatingPool = allSources.slice(80);
            const sourceWindow = 900;
            const wave = rotatingPool.length ? Math.floor(Date.now()/(2*60*60*1000)) % Math.max(1,Math.ceil(rotatingPool.length/sourceWindow)) : 0;
            const rotationStart = rotatingPool.length ? (wave*sourceWindow)%rotatingPool.length : 0;
            const rotatingSources = rotatingPool.length ? Array.from({length:Math.min(sourceWindow,rotatingPool.length)},(_,i)=>rotatingPool[(rotationStart+i)%rotatingPool.length]) : [];
            const sourceUnique = new Map();
            for (const source of [...coreSources,...rotatingSources]) sourceUnique.set(source.base.toLowerCase(), source);
            const sources = [...sourceUnique.values()].slice(0,1000).map(source => ({
              key:source.key,
              url:source.base+'?tab=shorts',
              language:'persian',
              source_priority:sourcePriority(source),
              source_label:source.label || source.key,
              source_index:source.sourceIndex || source.indexPage || 'mediafarsi_index'
            }));
            console.log('MEDIAFARSI_SOURCE_COVERAGE', JSON.stringify({
              index_pages:INDEX_PAGES.length,
              index_pages_ok:firstLevel.filter(x=>!x.error).length,
              sitemap_pages_scanned:sitemapLevelOne.length+sitemapLevelTwo.length,
              sitemap_page_errors:[...sitemapLevelOne,...sitemapLevelTwo].filter(x=>x.error).length,
              category_pages_found:categoryMap.size,
              category_pages_scanned:secondLevel.length,
              category_pages_ok:secondLevel.filter(x=>!x.error).length,
              unique_channel_sources:allSources.length,
              selected_channel_sources:sources.length,
              rotating_window_size:sourceWindow,
              rotation_wave:wave,
              source_errors:[...indexResults,...secondLevel].filter(x=>x.error).map(x=>({url:x.url,error:x.error})).slice(0,15)
            }));
            fs.writeFileSync('out/mediafarsi-source-catalog.json', JSON.stringify({
              generated_at: new Date().toISOString(),
              coverage: {
                index_pages: INDEX_PAGES,
                index_pages_ok: firstLevel.filter(x => !x.error).length,
                sitemap_pages_scanned: sitemapLevelOne.length + sitemapLevelTwo.length,
                category_pages_discovered: categoryMap.size,
                category_pages_scanned: secondLevel.length,
                unique_channels_discovered: allSources.length,
                channel_sources_selected_for_this_run: sources.length,
                rotating_window_size: sourceWindow,
                rotation_wave: wave
              },
              all_sources: allSources.map(source => ({
                key: source.key,
                url: source.base,
                label: source.label || source.key,
                context: source.context || '',
                source_priority: sourcePriority(source),
                discovery_origin: source.sourceIndex || source.indexPage || 'mediafarsi_index'
              })),
              selected_sources: sources.map(source => ({
                key: source.key,
                url: source.url,
                source_priority: source.source_priority,
                source_index: source.source_index
              }))
            }, null, 2), 'utf8');

            const results = [];
            const errors = [];
            const queue = [...sources];
            async function scanWorker() {
              while (queue.length) {
                const src = queue.shift();
                if (!src) continue;
                const page = await context.newPage();
                page.setDefaultTimeout(7000);
                try {
                  await page.goto(src.url, {waitUntil:'domcontentloaded', timeout:15000});
                  await page.waitForSelector('article.rd-video-card.is-short', {timeout:4500}).catch(()=>{});
                  await page.waitForTimeout(120);
                  const data = await page.evaluate(() => {
                    const norm = s => (s || '').replace(/\s+/g,' ').trim();
                    const cards = [...document.querySelectorAll('article.rd-video-card.is-short')];
                    return {
                      pageTitle: document.title,
                      pageUrl: location.href,
                      pageText: document.body.innerText.slice(0,1000),
                      cards: cards.map(card => {
                        const a = card.querySelector('a.rd-thumb-link[href*="/shorts/"]') || card.querySelector('a[href*="/shorts/"]');
                        const href = a ? a.href.split('?')[0] : '';
                        const match = href.match(/\/shorts\/([A-Za-z0-9_-]{11})(?:\/|$)/);
                        const img = card.querySelector('img');
                        const title = norm((a && a.getAttribute('aria-label')) || (img && img.getAttribute('alt')) || (a && a.innerText) || '');
                        return {video_id: match ? match[1] : '', title, href, card_text: norm(card.innerText), thumbnail: img ? img.src : ''};
                      }).filter(x => x.video_id && x.title)
                    };
                  });
                  for (const card of data.cards) results.push({
                    ...card,
                    source_channel:src.key,
                    source_page:src.url,
                    source_language_priority:src.language,
                    language_priority:src.language,
                    is_short:true,
                    vertical_fit:'shorts_vertical_candidate',
                    vertical_evidence:'MediaFarsi Shorts list; source ratio still requires metadata verification',
                    target_aspect_ratio:'9:16',
                    youtube_url:'https://www.youtube.com/shorts/' + card.video_id
                  });
                  console.log('SOURCE_RESULT', JSON.stringify({
                    source:src.key, status:'ok', cards:data.cards.length, pageTitle:data.pageTitle, finalUrl:data.pageUrl
                  }));
                  if (!data.cards.length) errors.push({source:src.key, error:'No rendered Shorts cards detected'});
                } catch (e) {
                  errors.push({source:src.key, error:String(e.message || e).slice(0,240)});
                  console.log('SOURCE_RESULT', JSON.stringify({source:src.key, error:String(e.message || e).slice(0,240)}));
                } finally {
                  await page.close().catch(()=>{});
                }
              }
            }
            await Promise.all(Array.from({length:Math.min(16,sources.length)}, () => scanWorker()));
            await browser.close();
            const unique = new Map();
            for (const x of results) {
              const old = unique.get(x.video_id);
              if (!old || (x.title.length > old.title.length && !/^\d{1,2}:\d{2}(?::\d{2})?$/.test(old.title))) unique.set(x.video_id,x);
            }
            const out = {
              generated_at:new Date().toISOString(),
              source:'Dynamic MediaFarsi source-index crawl plus public channel Shorts metadata',
              source_coverage: { selected_channel_sources:sources.length, attempted_channel_sources:results.length, discovered_channels:allSources.length, source_errors:errors.length },
              note:'Discovery only: public metadata does not grant republication rights. Nothing was downloaded or uploaded.',
              candidate_count:unique.size,
              source_errors:errors,
              candidates:[...unique.values()]
            };
            fs.writeFileSync('out/rendered_candidates.json', JSON.stringify(out,null,2));
            console.log('RENDERED_CANDIDATES', unique.size);
            console.log('RENDERED_SOURCE_ERRORS', JSON.stringify(errors));
          })().catch(e => { console.error('RENDERED_SCOUT_FAILED', e); process.exit(1); });
          NODE
      - name: Score candidates and track observed growth
        run: |
          python - <<'PY'
          import json, re, html
          from datetime import datetime, timezone
          from pathlib import Path

          NOW = datetime.now(timezone.utc)
          raw = json.loads(Path("out/rendered_candidates.json").read_text(encoding="utf-8"))
          DIGITS = str.maketrans("۰۱۲۳۴۵۶۷۸۹٠١٢٣٤٥٦٧٨٩", "01234567890123456789")

          def norm(s):
              return re.sub(r"\s+", " ", html.unescape(s or "")).strip()
          def views_from(text):
              t = norm(text).translate(DIGITS).lower().replace(",", "")
              m = re.search(r"([0-9]+(?:\.[0-9]+)?)\s*(میلیون|میلیارد|هزار|m\b|k\b)?\s*(?:بازدید|view(?:s)?|مشاهده)", t, re.I)
              if not m: return None
              try: n = float(m.group(1))
              except: return None
              unit = (m.group(2) or "").lower()
              if unit in ("هزار", "k"): n *= 1_000
              elif unit in ("میلیون", "m"): n *= 1_000_000
              elif unit == "میلیارد": n *= 1_000_000_000
              return int(n)
          def age_hours_from(text):
              t = norm(text).translate(DIGITS).lower()
              patterns = [
                  (r"(\d+)\s*دقیقه\s*پیش", 1/60),
                  (r"(\d+)\s*ساعت\s*پیش", 1),
                  (r"(\d+)\s*روز\s*پیش", 24),
                  (r"(\d+)\s*هفته\s*پیش", 168),
                  (r"(\d+)\s*ماه\s*پیش", 730),
                  (r"(\d+)\s*سال\s*پیش", 8760)
              ]
              for pattern, factor in patterns:
                  m = re.search(pattern, t)
                  if m: return max(1/60, int(m.group(1))*factor)
              if "دیروز" in t: return 24
              if "امروز" in t: return 1
              return None
          def is_persian(s):
              # Prefer Persian-specific letters/wording over the broader Arabic-script range.
              return bool(re.search(r"[پچژگکی]", s or "")) or bool(re.search(r"\b(چرا|وقتی|همه|خنده|دوربین|بامزه|میخواد|میکنی|نمی|شما|این|اون)\b", s or ""))
          def classify_format(title, source_language):
              t = norm(title).lower()
              if is_persian(t) or source_language == "persian":
                  return "persian_priority", "Persian-script/title or Persian-first source channel"
              visual = re.compile(
                  r"\b(cctv|dashcam|body ?cam|security camera|caught on camera|instant karma|near miss|epic fails?|funny moments|unexpected moments|oddly satisfying|satisfying|no talking|without talking|silent comedy|wordless|nonverbal|visual comedy|slapstick|animal fails?|funny animals?|cat|dog|rooster|optical illusion|magic trick|trust my eyes|can.t trust my eyes|perfect loop)\b",
                  re.I
              )
              if visual.search(t):
                  return "language_neutral_candidate", "Title signals visual-first/animal/camera content; verify actual speech and rights"
              if source_language == "mixed":
                  return "language_check_required", "Mixed-source clip without enough evidence that language is irrelevant"
              return "language_unknown_review", "Language/visual dependence cannot be determined from the title alone"
          def short_id(s):
              return bool(re.fullmatch(r"[A-Za-z0-9_-]{11}", s or ""))
          
          state_path = Path("state/trends.json")
          try: state = json.loads(state_path.read_text(encoding="utf-8"))
          except: state = {"videos":{}}
          tracked = state.get("videos", {})
          candidates = []
          for item in raw.get("candidates", []):
              title = norm(item.get("title"))
              vid = item.get("video_id")
              if not short_id(vid) or not title:
                  continue
              # This is an entertainment-focused scout; skip politics, ethnicity, and overtly violent headlines.
              excluded_topic = re.compile(r"توافق|جنگ|سیاست|سیاسی|انتخابات|قومیت|نژاد|خامنه|ترور|اعدام|قتل|اسلحه|سلاح|موشک|سجیل|پهپاد|بمب|نظامی|تسلیحاتی|حمله|درگیری|اختلاس|فساد|انقلاب|حمله به صنعت رپ", re.I)
              if excluded_topic.search(title):
                  continue
              card_text = norm(item.get("card_text"))
              views = views_from(card_text)
              age = age_hours_from(card_text)
              # Exclude stale items older than 30 days from the viral-hunt shortlist.
              if age is not None and age > 720:
                  continue
              old = tracked.get(vid, {})
              prev_views = old.get("last_views")
              prev_at = old.get("last_seen_at")
              rate = None
              delta = None
              elapsed = None
              if isinstance(prev_views, int) and isinstance(views, int) and prev_at:
                  try:
                      elapsed = max(0, (NOW - datetime.fromisoformat(prev_at.replace("Z","+00:00"))).total_seconds()/3600)
                      # A real-growth comparison needs a full scan interval; ignore rapid manual/push-triggered reruns.
                      if elapsed >= 1.5 and views >= prev_views:
                          delta = views - prev_views
                          rate = round(delta/elapsed, 1)
                  except Exception:
                      elapsed = None
              v = dict(item)
              format_fit, format_reason = classify_format(title, item.get("language_priority", "unknown"))
              source_language = item.get("source_language_priority", item.get("language_priority", "unknown"))
              iranian_signal = bool(re.search(r"ایران|ایرانی|تهران|شیراز|اصفهان|تبریز|مشهد|Iran|Iranian|Tehran|Shiraz|Isfahan|Tabriz|Mashhad", title + " " + norm(item.get("source_channel","")), re.I))
              local_score = 4 if iranian_signal and (source_language == "persian" or is_persian(title)) else (3 if source_language == "persian" or is_persian(title) else (2 if iranian_signal else 0))
              v.update({
                  "title":title,
                  "views":views,
                  "age_hours":round(age,2) if age is not None else None,
                  "views_per_hour_proxy":round(views/age,1) if views is not None and age and age > 0 else None,
                  "observed_view_delta":delta,
                  "observed_views_per_hour":rate,
                  "license_status":"not verified; do not reupload",
                  "format_fit":format_fit,
                  "format_reason":format_reason,
                  "source_language_priority":source_language,
                  "content_locality_score":local_score,
                  "vertical_fit":"shorts_vertical_candidate" if item.get("is_short") else "unknown",
                  "vertical_evidence":item.get("vertical_evidence","shorts_source_candidate; exact ratio not confirmed"),
                  "target_aspect_ratio":"9:16",
                  "license_status":"not verified; do not reupload",
                  "republish_eligible":False,
                  "language_priority":"persian" if (source_language == "persian" or format_fit == "persian_priority") else ("mixed / language check required" if source_language == "mixed" else ("language-neutral candidate" if format_fit == "language_neutral_candidate" else "unknown"))
              })
              candidates.append(v)
              history = old.get("history", [])
              if isinstance(views, int):
                  history.append({"at":NOW.isoformat(),"views":views})
                  history = history[-8:]
                  baseline_is_new = not prev_at or (elapsed is not None and elapsed >= 1.5)
                  tracked[vid] = {
                      "first_seen_at":old.get("first_seen_at",NOW.isoformat()),
                      "last_seen_at":NOW.isoformat() if baseline_is_new else prev_at,
                      "last_views":views if baseline_is_new else prev_views,
                      "history":history,
                      "title":title,
                      "source_url":v.get("youtube_url")
                  }
          keywords = re.compile(r"دوربین مخفی|پرنک|prank|لحظه|اتفاق|بامزه|حیوان|گربه|سگ|ترس|پریدن|غافلگیر|چالش|خنده|funny|fail|caught|unexpected|animal|cat|dog|rooster|trust my eyes|nightmare", re.I)
          def score(x):
              observed = x.get("observed_views_per_hour")
              proxy = x.get("views_per_hour_proxy")
              age = x.get("age_hours")
              freshness = 2 if age is not None and age <= 48 else 1 if age is not None and age <= 168 else 0
              persian = 3 if x.get("language_priority") == "persian" else 2 if x.get("language_priority") == "mixed / language check required" else 1 if x.get("format_fit") == "language_neutral_candidate" else 0
              vertical = 2 if x.get("vertical_fit") == "shorts_vertical_candidate" else 1
              local = x.get("content_locality_score") or 0
              topic = 1 if keywords.search(x.get("title","")) else 0
              # Editorial fit leads; observed velocity breaks ties among Persian/local and portrait candidates.
              observed_signal = 1 if observed is not None and observed >= 300 else 0
              measured_velocity = observed if observed_signal else -1
              format_priority = {"persian_priority":2,"language_neutral_candidate":1,"language_check_required":0,"language_unknown_review":0}.get(x.get("format_fit"), 0)
              return (
                  local,
                  persian,
                  vertical,
                  format_priority,
                  observed_signal,
                  measured_velocity,
                  freshness,
                  topic,
                  proxy if proxy is not None else -1,
                  x.get("views") or -1
              )
          candidates.sort(key=score, reverse=True)
          if len(tracked) > 1500:
              tracked = dict(sorted(tracked.items(), key=lambda kv:kv[1].get("last_seen_at",""), reverse=True)[:1500])
          state_path.write_text(json.dumps({"updated_at":NOW.isoformat(),"videos":tracked},ensure_ascii=False,indent=2), encoding="utf-8")
          report = {
              "generated_at":NOW.isoformat(),
              "source_errors":raw.get("source_errors",[]),
              "candidate_count":len(candidates),
              "content_policy":{"language":"Persian (fa)","market":"Iran (only when metadata gives a signal; creator location is not assumed)","target_aspect_ratio":"9:16","ranking_order":["Iran/Persian signal","Shorts/portrait evidence","measured growth","freshness"],"rights_gate":"metadata-only leads are not publishable unless reuse rights are independently verified"},
              "note":"Trend scout reports public metadata only. Persian/Iran-related signals and Shorts/portrait evidence rank ahead of raw velocity. A Shorts listing is not exact ratio verification; every published output is transcoded to 9:16. Public visibility or a Creative Commons search filter alone does not grant republication rights.",
              "candidates":candidates[:100]
          }
          Path("out/candidates.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          def esc(s):
              return str(s or "").replace("|","\\|").replace("\n"," ")[:130]
          md = [
              "# Persian/Iran-first vertical video trend leads", "",
              f"Generated: {NOW.isoformat()}", "",
              "**No media was downloaded or uploaded.** Rights are unverified for all trend leads.",
              "Priority: Persian/iran-related signals first, Shorts/portrait candidates second, observed growth third. Final output target for publishers is 1080×1920 (9:16).",
              "A source marked Shorts is not proof of exact dimensions, and no trend lead may be republished without verified reuse rights.", "",
              "| Rank | Title | Views | Age (h) | Observed growth/h | Proxy/h | Source |",
              "|---:|---|---:|---:|---:|---:|---|"
          ]
          for i,v in enumerate(candidates[:60],1):
              views = f'{v["views"]:,}' if v.get("views") is not None else "—"
              age = v.get("age_hours") if v.get("age_hours") is not None else "—"
              growth = v.get("observed_views_per_hour") if v.get("observed_views_per_hour") is not None else "—"
              proxy = v.get("views_per_hour_proxy") if v.get("views_per_hour_proxy") is not None else "—"
              md.append(f'| {i} | [{esc(v["title"])}]({v.get("youtube_url") or v.get("source_page")}) | {views} | {age} | {growth} | {proxy} | {esc(v.get("source_channel"))} |')
          if raw.get("source_errors"):
              md += ["", "## Source errors"]
              md += [f'- {esc(x.get("source"))}: {esc(x.get("error","unknown"))}' for x in raw["source_errors"]]
          Path("out/candidates.md").write_text("\n".join(md)+"\n",encoding="utf-8")
          print("CANDIDATES",len(candidates))
          print("SOURCES_WITH_ERRORS",len(raw.get("source_errors",[])))
          print("TOP_LEADS")
          for x in candidates[:20]:
              print(json.dumps({k:x.get(k) for k in ["title","youtube_url","source_channel","views","age_hours","views_per_hour_proxy","observed_views_per_hour","language_priority","format_fit","format_reason","license_status"]},ensure_ascii=False))
          PY
      - name: Scout public Telegram and Aparat feeds
        run: node scripts/platform_scout.cjs
      - name: Inspect public YouTube reuse-license metadata for leading candidates
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          node --check scripts/license_check.cjs
          node scripts/license_check.cjs
      - name: Merge one shared Persian/Iran-first vertical shortlist for all destination adapters
        run: |
          node --check scripts/merge_short_candidates.cjs
          node scripts/merge_short_candidates.cjs
      - name: Commit trend snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/trends.json state/platform-trends.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Persian-first Shorts trend snapshots"
          fi
          # This workflow shares a concurrency group with trend-intelligence because both update platform-trends.json.
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep "$attempt"
              continue
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$attempt"
          done
          echo "Unable to persist trend snapshots after four attempts." >&2
          exit 1
      - name: Save candidate report artifact
        uses: actions/upload-artifact@v7
        with:
          name: filo-candidate-discovery
          path: out/
          retention-days: 14
