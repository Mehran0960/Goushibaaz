name: Persian-first Filo trend scout

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"
  push:
    paths:
      - ".github/workflows/discover-filo-candidates.yml"

permissions:
  contents: write

concurrency:
  group: filo-trend-scout
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install discovery tools
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Discover public Persian Shorts and language-light leads
        run: |
          mkdir -p out state
          python <<'PY'
          import json, re, requests, html
          from bs4 import BeautifulSoup
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          NOW = datetime.now(timezone.utc)
          SOURCES = [
              ("mediafarsi_shorts", "https://mediafarsi.com/shorts", "persian"),
              ("memento_shorts", "https://mediafarsi.com/channel/memento-studios?tab=shorts", "persian"),
              ("memento_recent", "https://mediafarsi.com/channel/memento-studios", "persian"),
              ("mikikalafe_shorts", "https://mediafarsi.com/channel/mikikalafe?tab=shorts", "persian"),
              ("mikikalafe_recent", "https://mediafarsi.com/channel/mikikalafe", "persian"),
              ("mehdi_jahaan_shorts", "https://mediafarsi.com/channel/mehdi-jahaan?tab=shorts", "persian"),
              ("mehdi_jahaan_recent", "https://mediafarsi.com/channel/mehdi-jahaan", "persian"),
              ("hidden_camera", "https://mediafarsi.com/channel/naserkianofficial", "persian"),
              ("sargarmi", "https://channeldb.com/hi/c/%40sargarmi-p1f", "persian"),
          ]
          DIGITS = str.maketrans("۰۱۲۳۴۵۶۷۸۹٠١٢٣٤٥٦٧٨٩", "01234567890123456789")
          def norm(s):
              return re.sub(r"\s+", " ", html.unescape(s or "")).strip()
          def int_fa(s):
              try: return int(str(s).translate(DIGITS).replace(",", "").replace(".", ""))
              except: return None
          def views_from(text):
              t = norm(text).translate(DIGITS).lower().replace(",", "")
              matches = list(re.finditer(r"([0-9]+(?:\.[0-9]+)?)\s*(میلیون|میلیارد|هزار|m\b|k\b)?\s*(?:بازدید|view(?:s)?|مشاهده)", t, re.I))
              if not matches: return None
              m = matches[0]
              try: n=float(m.group(1))
              except: return None
              unit=(m.group(2) or "").lower()
              if unit in ("هزار","k"): n*=1_000
              elif unit in ("میلیون","m"): n*=1_000_000
              elif unit=="میلیارد": n*=1_000_000_000
              return int(n)
          def age_hours_from(text):
              t = norm(text).translate(DIGITS).lower()
              pats = [
                  (r"(\d+)\s*دقیقه\s*پیش", 1/60),
                  (r"(\d+)\s*ساعت\s*پیش", 1),
                  (r"(\d+)\s*روز\s*پیش", 24),
                  (r"(\d+)\s*هفته\s*پیش", 168),
                  (r"(\d+)\s*ماه\s*پیش", 730),
                  (r"(\d+)\s*سال\s*پیش", 8760),
              ]
              for pat, factor in pats:
                  m=re.search(pat,t)
                  if m: return max(1/60, int(m.group(1))*factor)
              words={"امروز":1,"دیروز":24,"یک روز پیش":24,"دیروز":24,"یک هفته پیش":168}
              for token,val in words.items():
                  if token in t: return val
              return None
          def duration_seconds(text):
              t=norm(text).translate(DIGITS)
              m=re.search(r"(?<!\d)(\d{1,2}):(\d{2})(?::(\d{2}))?(?!\d)",t)
              if not m: return None
              parts=[int(x) for x in m.groups() if x is not None]
              return parts[0]*60+parts[1] if len(parts)==2 else parts[0]*3600+parts[1]*60+parts[2]
          session=requests.Session()
          session.headers.update({"User-Agent":"Mozilla/5.0 (compatible; GoushibaazTrendScout/1.0; public-metadata-only)"})
          raw=[]; errors=[]
          for source, page_url, lang in SOURCES:
              try:
                  resp=session.get(page_url,timeout=22)
                  if resp.status_code!=200:
                      errors.append({"source":source,"status":resp.status_code}); continue
                  soup=BeautifulSoup(resp.text,"html.parser")
                  seen=set()
                  anchors=soup.select('a[href*="/video/"]')
                  print("SOURCE_SCAN", json.dumps({"source":source,"status":resp.status_code,"anchors":len(anchors),"final_url":resp.url,"title":soup.title.get_text(" ",strip=True) if soup.title else ""},ensure_ascii=False))
                  for a in anchors:
                      href=urljoin(page_url,a.get("href",""))
                      parsed=urlparse(href)
                      if parsed.netloc and parsed.netloc not in ("mediafarsi.com","www.mediafarsi.com"): continue
                      vid=parsed.path.rstrip("/").split("/")[-1]
                      if not vid or vid in seen: continue
                      seen.add(vid)
                      title=norm(a.get_text(" ",strip=True))
                      node=a
                      card_text=title
                      for _ in range(5):
                          if not node.parent: break
                          node=node.parent
                          txt=norm(node.get_text(" ",strip=True))
                          if len(txt)>20 and len(txt)<650 and (views_from(txt) is not None or age_hours_from(txt) is not None):
                              card_text=txt
                              break
                      views=views_from(card_text)
                      age=age_hours_from(card_text)
                      duration=duration_seconds(card_text)
                      # Do not treat old/month-only pages as proof of fresh growth.
                      source_url=href
                      youtube_url="https://www.youtube.com/watch?v="+vid if re.fullmatch(r"[A-Za-z0-9_-]{11}",vid) else None
                      raw.append({
                          "video_id":vid,"title":title or card_text[:140],"source_channel":source,
                          "source_page":page_url,"source_url":source_url,"youtube_url":youtube_url,
                          "language_priority":lang,"views":views,"age_hours":round(age,2) if age else None,
                          "views_per_hour_proxy":round(views/age,1) if views is not None and age else None,
                          "duration_seconds":duration,"license_status":"not verified; do not reupload",
                          "card_text":card_text[:500]
                      })
              except Exception as e:
                  errors.append({"source":source,"error":str(e)[:220]})

          # De-duplicate same YouTube/source video.
          unique={}
          for v in raw:
              key=v["video_id"]
              old=unique.get(key)
              if old is None or len(v.get("card_text",""))>len(old.get("card_text","")): unique[key]=v
          candidates=list(unique.values())

          state_path=Path("state/trends.json")
          try: state=json.loads(state_path.read_text(encoding="utf-8"))
          except: state={"videos":{}}
          tracked=state.get("videos",{})
          for v in candidates:
              old=tracked.get(v["video_id"],{})
              prev_views=old.get("last_views")
              prev_at=old.get("last_seen_at")
              rate=None; delta=None
              if isinstance(prev_views,int) and isinstance(v.get("views"),int) and prev_at and v["views"]>=prev_views:
                  try:
                      elapsed=max(1/60,(NOW-datetime.fromisoformat(prev_at.replace("Z","+00:00"))).total_seconds()/3600)
                      delta=v["views"]-prev_views
                      rate=round(delta/elapsed,1)
                  except: pass
              v["observed_view_delta"]=delta
              v["observed_views_per_hour"]=rate
              history=old.get("history",[])
              if v.get("views") is not None:
                  history.append({"at":NOW.isoformat(),"views":v["views"]})
                  history=history[-8:]
                  tracked[v["video_id"]]={"first_seen_at":old.get("first_seen_at",NOW.isoformat()),
                                          "last_seen_at":NOW.isoformat(),"last_views":v["views"],"history":history,
                                          "title":v["title"],"source_url":v["source_url"]}
          # Prioritize verified observed growth; then recent high velocity; then Persian relevance.
          candidates.sort(key=lambda x:(
              x["observed_views_per_hour"] if x["observed_views_per_hour"] is not None else -1,
              x["views_per_hour_proxy"] if x["views_per_hour_proxy"] is not None else -1,
              1 if x["language_priority"]=="persian" else 0,
              x["views"] if x["views"] is not None else -1
          ), reverse=True)
          # Bound state size to most recently seen 1,000 IDs.
          if len(tracked)>1000:
              tracked=dict(sorted(tracked.items(),key=lambda kv:kv[1].get("last_seen_at",""),reverse=True)[:1000])
          state_path.write_text(json.dumps({"updated_at":NOW.isoformat(),"videos":tracked},ensure_ascii=False,indent=2),encoding="utf-8")
          report={
              "generated_at":NOW.isoformat(),"candidate_count":len(candidates),"source_errors":errors,
              "important":"Discovery leads only. Public visibility does not grant republication rights. Only upload after documented permission/license verification.",
              "candidates":candidates[:100]
          }
          Path("out/candidates.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          def esc(s): return str(s or "").replace("|","\\|").replace("\\n"," ")[:150]
          md=["# Persian-first video trend leads","",f"Generated: {NOW.isoformat()}","",
              "**No media was downloaded or uploaded.** License status is intentionally unverified for these trend leads.",
              "Observed views/hour is only available after at least two scans; one-scan views/hour is a rough proxy based on posted age.","",
              "| Rank | Title / source | Views | Age (h) | Observed growth/h | One-scan proxy/h | License |",
              "|---:|---|---:|---:|---:|---:|---|"]
          for i,v in enumerate(candidates[:60],1):
              def esc(s): return str(s or "").replace("|","\|").replace("\n"," ")[:150]
              link=v.get("youtube_url") or v["source_url"]
              views=f'{v["views"]:,}' if v.get("views") is not None else "—"
              age=v.get("age_hours") if v.get("age_hours") is not None else "—"
              growth=v.get("observed_views_per_hour") if v.get("observed_views_per_hour") is not None else "—"
              proxy=v.get("views_per_hour_proxy") if v.get("views_per_hour_proxy") is not None else "—"
              md.append(f'| {i} | [{esc(v["title"])}]({link}) · {esc(v["source_channel"])} | {views} | {age} | {growth} | {proxy} | not verified |')
          if errors:
              md += ["","## Source errors"]+[f'- {esc(e.get("source"))}: {esc(e.get("error",e.get("status","unknown")))}' for e in errors]
          Path("out/candidates.md").write_text("\n".join(md)+"\n",encoding="utf-8")
          print("CANDIDATES",len(candidates))
          print("SOURCE_ERRORS",json.dumps(errors,ensure_ascii=False))
          print("TOP_LEADS")
          for v in candidates[:25]:
              print(json.dumps({k:v.get(k) for k in ["title","youtube_url","source_url","source_channel","views","age_hours","views_per_hour_proxy","observed_views_per_hour","license_status"]},ensure_ascii=False))
          PY
      - name: Save trend snapshot and candidate report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/trends.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Persian-first trend snapshots"
            git push
          fi
          git status --short
      - name: Save candidate report artifact
        uses: actions/upload-artifact@v4
        with:
          name: filo-candidate-discovery
          path: out/
          retention-days: 14
