name: Persian-first Filo trend scout

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"
  push:
    paths:
      - ".github/workflows/discover-filo-candidates.yml"

permissions:
  contents: write

concurrency:
  group: filo-trend-scout
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser discovery
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Render and collect public Persian Shorts metadata
        run: |
          mkdir -p out state
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');
          (async () => {
            const sources = [
              {key:'memento', url:'https://mediafarsi.com/channel/memento-studios?tab=shorts', language:'persian'},
              {key:'mikikalafe', url:'https://mediafarsi.com/channel/mikikalafe?tab=shorts', language:'mixed'},
              {key:'mehdi_jahaan', url:'https://mediafarsi.com/channel/mehdi-jahaan?tab=shorts', language:'persian'},
              {key:'chizomiz', url:'https://mediafarsi.com/channel/chizomiz?tab=shorts', language:'persian'},
              {key:'fasteris', url:'https://mediafarsi.com/channel/fasteris?tab=shorts', language:'mixed'},
              {key:'mrnoon', url:'https://mediafarsi.com/channel/mrnoon?tab=shorts', language:'persian'},
              {key:'tpm', url:'https://mediafarsi.com/channel/tpm-top-persian-movies?tab=shorts', language:'persian'},
              {key:'khotan', url:'https://mediafarsi.com/channel/khotan?tab=shorts', language:'persian'},
              {key:'amootheory', url:'https://mediafarsi.com/channel/amootheory?tab=shorts', language:'persian'},
              {key:'kouman', url:'https://mediafarsi.com/channel/kouman?tab=shorts', language:'persian'},
              {key:'nikshah_zone', url:'https://mediafarsi.com/channel/nikshah-zone?tab=shorts', language:'persian'},
              {key:'sahar_hoc', url:'https://mediafarsi.com/channel/sahar-hoc?tab=shorts', language:'persian'},
              {key:'mehran_magnet', url:'https://mediafarsi.com/channel/mehran-magnet?tab=shorts', language:'mixed'},
              {key:'nikshah', url:'https://mediafarsi.com/channel/nikshah?tab=shorts', language:'persian'}
            ];
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({
              userAgent:'Mozilla/5.0 (compatible; GoushibaazTrendScout/1.0; public-metadata-only)',
              locale:'fa-IR'
            });
            const results = [];
            const errors = [];
            for (const src of sources) {
              const page = await context.newPage();
              page.setDefaultTimeout(12000);
              try {
                await page.goto(src.url, {waitUntil:'domcontentloaded', timeout:45000});
                await page.waitForSelector('article.rd-video-card.is-short', {timeout:10000}).catch(()=>{});
                await page.waitForTimeout(800);
                const data = await page.evaluate(() => {
                  const norm = s => (s || '').replace(/\s+/g,' ').trim();
                  const cards = [...document.querySelectorAll('article.rd-video-card.is-short')];
                  return {
                    pageTitle: document.title,
                    pageUrl: location.href,
                    pageText: document.body.innerText.slice(0,1000),
                    cards: cards.map(card => {
                      const a = card.querySelector('a.rd-thumb-link[href*="/shorts/"]') || card.querySelector('a[href*="/shorts/"]');
                      const href = a ? a.href.split('?')[0] : '';
                      const match = href.match(/\/shorts\/([A-Za-z0-9_-]{11})(?:\/|$)/);
                      const img = card.querySelector('img');
                      const title = norm((a && a.getAttribute('aria-label')) || (img && img.getAttribute('alt')) || (a && a.innerText) || '');
                      return {video_id: match ? match[1] : '', title, href, card_text: norm(card.innerText), thumbnail: img ? img.src : ''};
                    }).filter(x => x.video_id && x.title)
                  };
                });
                for (const card of data.cards) results.push({
                  ...card,
                  source_channel:src.key,
                  source_page:src.url,
                  language_priority:src.language,
                  youtube_url:'https://www.youtube.com/shorts/' + card.video_id
                });
                console.log('SOURCE_RESULT', JSON.stringify({
                  source:src.key, status:'ok', cards:data.cards.length, pageTitle:data.pageTitle, finalUrl:data.pageUrl
                }));
                if (!data.cards.length) errors.push({source:src.key, error:'No rendered Shorts cards detected'});
              } catch (e) {
                errors.push({source:src.key, error:String(e.message || e).slice(0,240)});
                console.log('SOURCE_RESULT', JSON.stringify({source:src.key, error:String(e.message || e).slice(0,240)}));
              } finally {
                await page.close();
              }
            }
            await browser.close();
            const unique = new Map();
            for (const x of results) {
              const old = unique.get(x.video_id);
              if (!old || (x.title.length > old.title.length && !/^\d{1,2}:\d{2}(?::\d{2})?$/.test(old.title))) unique.set(x.video_id,x);
            }
            const out = {
              generated_at:new Date().toISOString(),
              source:'Rendered public metadata from MediaFarsi channel Shorts lists',
              note:'Discovery only: public metadata does not grant republication rights. Nothing was downloaded or uploaded.',
              candidate_count:unique.size,
              source_errors:errors,
              candidates:[...unique.values()]
            };
            fs.writeFileSync('out/rendered_candidates.json', JSON.stringify(out,null,2));
            console.log('RENDERED_CANDIDATES', unique.size);
            console.log('RENDERED_SOURCE_ERRORS', JSON.stringify(errors));
          })().catch(e => { console.error('RENDERED_SCOUT_FAILED', e); process.exit(1); });
          NODE
      - name: Score candidates and track observed growth
        run: |
          python - <<'PY'
          import json, re, html
          from datetime import datetime, timezone
          from pathlib import Path

          NOW = datetime.now(timezone.utc)
          raw = json.loads(Path("out/rendered_candidates.json").read_text(encoding="utf-8"))
          DIGITS = str.maketrans("۰۱۲۳۴۵۶۷۸۹٠١٢٣٤٥٦٧٨٩", "01234567890123456789")

          def norm(s):
              return re.sub(r"\s+", " ", html.unescape(s or "")).strip()
          def views_from(text):
              t = norm(text).translate(DIGITS).lower().replace(",", "")
              m = re.search(r"([0-9]+(?:\.[0-9]+)?)\s*(میلیون|میلیارد|هزار|m\b|k\b)?\s*(?:بازدید|view(?:s)?|مشاهده)", t, re.I)
              if not m: return None
              try: n = float(m.group(1))
              except: return None
              unit = (m.group(2) or "").lower()
              if unit in ("هزار", "k"): n *= 1_000
              elif unit in ("میلیون", "m"): n *= 1_000_000
              elif unit == "میلیارد": n *= 1_000_000_000
              return int(n)
          def age_hours_from(text):
              t = norm(text).translate(DIGITS).lower()
              patterns = [
                  (r"(\d+)\s*دقیقه\s*پیش", 1/60),
                  (r"(\d+)\s*ساعت\s*پیش", 1),
                  (r"(\d+)\s*روز\s*پیش", 24),
                  (r"(\d+)\s*هفته\s*پیش", 168),
                  (r"(\d+)\s*ماه\s*پیش", 730),
                  (r"(\d+)\s*سال\s*پیش", 8760)
              ]
              for pattern, factor in patterns:
                  m = re.search(pattern, t)
                  if m: return max(1/60, int(m.group(1))*factor)
              if "دیروز" in t: return 24
              if "امروز" in t: return 1
              return None
          def is_persian(s):
              # Prefer Persian-specific letters/wording over the broader Arabic-script range.
              return bool(re.search(r"[پچژگکی]", s or "")) or bool(re.search(r"\b(چرا|وقتی|همه|خنده|دوربین|بامزه|میخواد|میکنی|نمی|شما|این|اون)\b", s or ""))
          def classify_format(title, source_language):
              t = norm(title).lower()
              if is_persian(t):
                  return "persian_priority", "Persian-specific text in title"
              visual = re.compile(
                  r"\b(cctv|dashcam|body ?cam|security camera|caught on camera|instant karma|near miss|epic fails?|funny moments|unexpected moments|oddly satisfying|satisfying|no talking|without talking|silent comedy|wordless|nonverbal|visual comedy|slapstick|animal fails?|funny animals?|cat|dog|rooster|optical illusion|magic trick|trust my eyes|can.t trust my eyes|perfect loop)\b",
                  re.I
              )
              if visual.search(t):
                  return "language_neutral_candidate", "Title signals visual-first/animal/camera content; verify actual speech and rights"
              if source_language == "mixed":
                  return "language_check_required", "Mixed-source clip without enough evidence that language is irrelevant"
              return "language_unknown_review", "Language/visual dependence cannot be determined from the title alone"
          def short_id(s):
              return bool(re.fullmatch(r"[A-Za-z0-9_-]{11}", s or ""))
          
          state_path = Path("state/trends.json")
          try: state = json.loads(state_path.read_text(encoding="utf-8"))
          except: state = {"videos":{}}
          tracked = state.get("videos", {})
          candidates = []
          for item in raw.get("candidates", []):
              title = norm(item.get("title"))
              vid = item.get("video_id")
              if not short_id(vid) or not title:
                  continue
              # This is an entertainment-focused scout; skip politics, ethnicity, and overtly violent headlines.
              excluded_topic = re.compile(r"توافق|جنگ|سیاست|سیاسی|انتخابات|قومیت|نژاد|خامنه|ترور|اعدام|قتل|اسلحه|سلاح|اختلاس|فساد|انقلاب|حمله به صنعت رپ", re.I)
              if excluded_topic.search(title):
                  continue
              card_text = norm(item.get("card_text"))
              views = views_from(card_text)
              age = age_hours_from(card_text)
              # Exclude stale items older than 30 days from the viral-hunt shortlist.
              if age is not None and age > 720:
                  continue
              old = tracked.get(vid, {})
              prev_views = old.get("last_views")
              prev_at = old.get("last_seen_at")
              rate = None
              delta = None
              elapsed = None
              if isinstance(prev_views, int) and isinstance(views, int) and prev_at:
                  try:
                      elapsed = max(0, (NOW - datetime.fromisoformat(prev_at.replace("Z","+00:00"))).total_seconds()/3600)
                      # A real-growth comparison needs a full scan interval; ignore rapid manual/push-triggered reruns.
                      if elapsed >= 1.5 and views >= prev_views:
                          delta = views - prev_views
                          rate = round(delta/elapsed, 1)
                  except Exception:
                      elapsed = None
              v = dict(item)
              format_fit, format_reason = classify_format(title, item.get("language_priority", "unknown"))
              v.update({
                  "title":title,
                  "views":views,
                  "age_hours":round(age,2) if age is not None else None,
                  "views_per_hour_proxy":round(views/age,1) if views is not None and age and age > 0 else None,
                  "observed_view_delta":delta,
                  "observed_views_per_hour":rate,
                  "license_status":"not verified; do not reupload",
                  "format_fit":format_fit,
                  "format_reason":format_reason,
                  "language_priority":"persian" if format_fit == "persian_priority" else ("language-neutral candidate" if format_fit == "language_neutral_candidate" else ("mixed / language check required" if item.get("language_priority") == "mixed" else "unknown"))
              })
              candidates.append(v)
              history = old.get("history", [])
              if isinstance(views, int):
                  history.append({"at":NOW.isoformat(),"views":views})
                  history = history[-8:]
                  baseline_is_new = not prev_at or (elapsed is not None and elapsed >= 1.5)
                  tracked[vid] = {
                      "first_seen_at":old.get("first_seen_at",NOW.isoformat()),
                      "last_seen_at":NOW.isoformat() if baseline_is_new else prev_at,
                      "last_views":views if baseline_is_new else prev_views,
                      "history":history,
                      "title":title,
                      "source_url":v.get("youtube_url")
                  }
          keywords = re.compile(r"دوربین مخفی|پرنک|prank|لحظه|اتفاق|بامزه|حیوان|گربه|سگ|ترس|پریدن|غافلگیر|چالش|خنده|funny|fail|caught|unexpected|animal|cat|dog|rooster|trust my eyes|nightmare", re.I)
          def score(x):
              observed = x.get("observed_views_per_hour")
              proxy = x.get("views_per_hour_proxy")
              age = x.get("age_hours")
              freshness = 2 if age is not None and age <= 48 else 1 if age is not None and age <= 168 else 0
              persian = 2 if x.get("language_priority") == "persian" else 1 if x.get("language_priority") == "mixed / language may be irrelevant" else 0
              topic = 1 if keywords.search(x.get("title","")) else 0
              # Only positive measured velocity counts as a live trend signal; a flat count must not outrank fresh clips.
              observed_signal = 1 if observed is not None and observed >= 300 else 0
              measured_velocity = observed if observed_signal else -1
              format_priority = {"persian_priority":2,"language_neutral_candidate":1,"language_check_required":0,"language_unknown_review":0}.get(x.get("format_fit"), 0)
              return (
                  observed_signal,
                  measured_velocity,
                  freshness,
                  format_priority,
                  persian,
                  topic,
                  proxy if proxy is not None else -1,
                  x.get("views") or -1
              )
          candidates.sort(key=score, reverse=True)
          if len(tracked) > 1500:
              tracked = dict(sorted(tracked.items(), key=lambda kv:kv[1].get("last_seen_at",""), reverse=True)[:1500])
          state_path.write_text(json.dumps({"updated_at":NOW.isoformat(),"videos":tracked},ensure_ascii=False,indent=2), encoding="utf-8")
          report = {
              "generated_at":NOW.isoformat(),
              "source_errors":raw.get("source_errors",[]),
              "candidate_count":len(candidates),
              "note":"Trend scout reports public metadata only. Views/hour from a single scan is a rough age-based proxy, not proof of growth. Persian titles rank first; visual-first titles are only candidates and must be checked for speech. Only reupload after verifying permissions/license and Filo compliance.",
              "candidates":candidates[:100]
          }
          Path("out/candidates.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          def esc(s):
              return str(s or "").replace("|","\\|").replace("\n"," ")[:130]
          md = [
              "# Persian-first video trend leads", "",
              f"Generated: {NOW.isoformat()}", "",
              "**No media was downloaded or uploaded.** Rights are unverified for all trend leads.",
              "Observed views/hour becomes available after repeated scans; the first scan uses only an age-based proxy.",
              "Format labels: Persian-first, visual-first candidate (verify actual speech), or language review required.", "",
              "| Rank | Title | Views | Age (h) | Observed growth/h | Proxy/h | Source |",
              "|---:|---|---:|---:|---:|---:|---|"
          ]
          for i,v in enumerate(candidates[:60],1):
              views = f'{v["views"]:,}' if v.get("views") is not None else "—"
              age = v.get("age_hours") if v.get("age_hours") is not None else "—"
              growth = v.get("observed_views_per_hour") if v.get("observed_views_per_hour") is not None else "—"
              proxy = v.get("views_per_hour_proxy") if v.get("views_per_hour_proxy") is not None else "—"
              md.append(f'| {i} | [{esc(v["title"])}]({v.get("youtube_url") or v.get("source_page")}) | {views} | {age} | {growth} | {proxy} | {esc(v.get("source_channel"))} |')
          if raw.get("source_errors"):
              md += ["", "## Source errors"]
              md += [f'- {esc(x.get("source"))}: {esc(x.get("error","unknown"))}' for x in raw["source_errors"]]
          Path("out/candidates.md").write_text("\n".join(md)+"\n",encoding="utf-8")
          print("CANDIDATES",len(candidates))
          print("SOURCES_WITH_ERRORS",len(raw.get("source_errors",[])))
          print("TOP_LEADS")
          for x in candidates[:20]:
              print(json.dumps({k:x.get(k) for k in ["title","youtube_url","source_channel","views","age_hours","views_per_hour_proxy","observed_views_per_hour","language_priority","format_fit","format_reason","license_status"]},ensure_ascii=False))
          PY
      - name: Scout public Telegram and Aparat feeds
        run: node scripts/platform_scout.cjs
      - name: Inspect public YouTube reuse-license metadata for leading candidates
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          const input = JSON.parse(fs.readFileSync('out/candidates.json', 'utf8'));
          const candidates = (input.candidates || []).filter(x =>
            x.youtube_url && ['persian_priority', 'language_neutral_candidate'].includes(x.format_fit)
          ).slice(0, 20);

          function classifyLicense(value) {
            const v = String(value || '').toLowerCase();
            if (!v) return 'license_not_exposed';
            if (v.includes('public domain') || v === 'cc0' || v === 'cc-zero') return 'public_domain_or_cc0';
            if (v.includes('creative commons') && v.includes('sharealike')) return 'cc_by_sa';
            if (v.includes('creative commons') && (v.includes('attribution') || v.includes('cc by'))) return 'cc_by';
            if (v.includes('cc by-sa')) return 'cc_by_sa';
            if (v.includes('cc by')) return 'cc_by';
            return 'standard_or_other';
          }

          async function inspect(browser, item) {
            const page = await browser.newPage({ locale: 'fa-IR' });
            page.setDefaultNavigationTimeout(20000);
            try {
              const u = new URL(item.youtube_url);
              const id = item.video_id || (u.pathname.match(/\/shorts\/([A-Za-z0-9_-]{11})/) || [])[1];
              if (!id) return {title:item.title,url:item.youtube_url,format_fit:item.format_fit,license_status:'bad_video_id'};
              const watchUrl = 'https://www.youtube.com/watch?v=' + encodeURIComponent(id);
              const response = await page.goto(watchUrl, { waitUntil: 'domcontentloaded', timeout: 20000 }).catch(() => null);
              await page.waitForTimeout(1400);
              const pageData = await page.evaluate(() => {
                const p = window.ytInitialPlayerResponse || null;
                const d = p && p.videoDetails || {};
                const m = p && p.microformat && p.microformat.playerMicroformatRenderer || {};
                const status = p && p.playabilityStatus && p.playabilityStatus.status || '';
                const title = d.title || document.title || '';
                return {
                  title: title.slice(0,160),
                  channel: (d.author || m.ownerChannelName || '').slice(0,100),
                  viewCount: Number(d.viewCount || 0) || null,
                  durationSeconds: Number(d.lengthSeconds || 0) || null,
                  license: String(m.license || d.license || '').slice(0,140),
                  playabilityStatus: status,
                  challenge: /unusual traffic|not a robot|captcha|sign in to confirm/i.test(document.body.innerText.slice(0,5000))
                };
              }).catch(() => ({}));
              const classification = classifyLicense(pageData.license);
              return {
                video_id: id,
                title: pageData.title || item.title,
                url: watchUrl,
                source_channel: pageData.channel || item.source_channel || '',
                view_count: pageData.viewCount || item.views || null,
                duration_seconds: pageData.durationSeconds || null,
                license: pageData.license || '',
                playability_status: pageData.playabilityStatus || '',
                http_status: response && response.status() || null,
                license_status: pageData.challenge ? 'metadata_blocked_by_challenge' : classification,
                format_fit: item.format_fit,
                note: 'License metadata is an initial signal, not proof that the uploader owns every element; verify commercial rights and Filo compliance before reuse.'
              };
            } catch (e) {
              return {
                title:item.title,url:item.youtube_url,format_fit:item.format_fit,
                license_status:'metadata_unavailable',error_kind:String(e && e.name || 'Error').slice(0,40)
              };
            } finally {
              await page.close().catch(() => {});
            }
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const results = [];
            let cursor = 0;
            const workers = Array.from({ length: Math.min(3, candidates.length) }, async () => {
              while (cursor < candidates.length) {
                const item = candidates[cursor++];
                results.push(await inspect(browser, item));
              }
            });
            await Promise.all(workers);
            await browser.close();

            results.sort((a,b) =>
              Number(!['cc_by','cc_by_sa','public_domain_or_cc0'].includes(a.license_status)) -
                Number(!['cc_by','cc_by_sa','public_domain_or_cc0'].includes(b.license_status)) ||
              Number(a.format_fit !== 'persian_priority') - Number(b.format_fit !== 'persian_priority') ||
              (b.view_count || 0) - (a.view_count || 0)
            );
            const eligible = results.filter(x => ['cc_by','cc_by_sa','public_domain_or_cc0'].includes(x.license_status));
            const report = {
              generated_at: new Date().toISOString(),
              checked_count: results.length,
              cc_or_public_domain_metadata_count: eligible.length,
              note: 'Metadata-only. Nothing was downloaded or uploaded. A license label is not proof of rights to all elements or permission under third-party platform terms.',
              results
            };
            fs.writeFileSync('out/license-check.json', JSON.stringify(report,null,2));
            console.log('LICENSE_SCAN_SUMMARY', JSON.stringify({
              checked: results.length,
              cc_or_public_domain_metadata: eligible.length,
              statuses: Object.fromEntries([...new Set(results.map(x=>x.license_status))].map(k=>[k,results.filter(x=>x.license_status===k).length]))
            }));
            console.log('LICENSE_SCAN_TOP_RESULTS');
            for (const x of results.slice(0,12)) console.log(JSON.stringify({
              title:x.title,url:x.url,source_channel:x.source_channel,view_count:x.view_count,
              license:x.license,license_status:x.license_status,format_fit:x.format_fit,http_status:x.http_status
            }));
          })().catch(e => { console.error('LICENSE_SCAN_FAILED', String(e && e.name || 'Error')); process.exit(1); });
          NODE
      - name: Commit trend snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/trends.json state/platform-trends.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Persian-first Shorts trend snapshots"
          fi
          # Another workflow or edit can update main while the browser scan runs; rebase instead of losing the snapshot.
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Save candidate report artifact
        uses: actions/upload-artifact@v4
        with:
          name: filo-candidate-discovery
          path: out/
          retention-days: 14
