name: Goushibaaz Multi-Source Trend Intelligence
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/trend_intelligence/**"
      - "scripts/import_trend_intelligence.cjs"
      - ".github/workflows/trend-intelligence.yml"
permissions:
  contents: write
# Shared lock: the Filo scout also writes platform-trends.json.
concurrency:
  group: goushibaaz-trend-state-writers
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install free discovery dependency
        run: pip install --disable-pip-version-check requests
      - name: Validate discovery and ranking code
        run: |
          python -m py_compile scripts/trend_intelligence/follower_growth.py scripts/trend_intelligence/social_discovery.py scripts/trend_intelligence/run_discovery.py scripts/trend_intelligence/build_preview.py scripts/trend_intelligence/test_social_discovery.py
          python -m unittest scripts/trend_intelligence/test_social_discovery.py
          node --check scripts/import_trend_intelligence.cjs
      - name: Scan public Telegram feeds, rotating web searches and optional YouTube API
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/trend_intelligence/run_discovery.py
      - name: Convert observed trend history into editorial topic weights
        run: node scripts/import_trend_intelligence.cjs
      - name: Build human-readable trend preview
        if: ${{ always() && hashFiles('state/trend-intelligence.json') != '' }}
        run: python scripts/trend_intelligence/build_preview.py
      - name: Upload trend preview artifact
        if: ${{ always() && hashFiles('reports/latest-trend-preview.md') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: goushibaaz-trend-preview
          path: reports/latest-trend-preview.md
          if-no-files-found: warn
          retention-days: 7
      - name: Persist trend intelligence independently
        if: ${{ always() && hashFiles('state/trend-intelligence.json') != '' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/trend-intelligence.json state/platform-trends.json
          if git diff --cached --quiet; then
            echo "No trend state change."
            exit 0
          fi
          git commit -m "Refresh multi-source video trend intelligence"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep "$attempt"
              continue
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          echo "Unable to persist trend intelligence after four attempts." >&2
          exit 1
