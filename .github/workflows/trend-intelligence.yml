name: Goushibaaz Multi-Source Trend Intelligence
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/trend_intelligence/**"
      - "scripts/import_trend_intelligence.cjs"
      - ".github/workflows/trend-intelligence.yml"
permissions:
  contents: write
concurrency:
  group: goushibaaz-trend-intelligence
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free discovery dependency
        run: pip install --disable-pip-version-check requests
      - name: Validate discovery and ranking code
        run: |
          python -m py_compile scripts/trend_intelligence/follower_growth.py scripts/trend_intelligence/social_discovery.py scripts/trend_intelligence/run_discovery.py
          node --check scripts/import_trend_intelligence.cjs
      - name: Scan public Telegram video feeds and rotating web searches
        run: python scripts/trend_intelligence/run_discovery.py
      - name: Convert observed trend history into editorial topic weights
        run: node scripts/import_trend_intelligence.cjs
      - name: Persist trend intelligence independently
        if: ${{ always() && hashFiles('state/trend-intelligence.json') != '' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/trend-intelligence.json state/platform-trends.json
          if git diff --cached --quiet; then
            echo "No trend state change."
            exit 0
          fi
          git commit -m "Refresh multi-source video trend intelligence"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          echo "Unable to persist trend intelligence after four attempts." >&2
          exit 1
