name: Rubika bot connection check (manual)

on:
  workflow_dispatch:
    inputs:
      discover_recent_updates:
        description: "Read recent Rubika updates and print chat IDs only (no message text)"
        required: true
        type: boolean
        default: false
      send_test_message:
        description: "Send a visible test message to RUBIKA_CHAT_ID after the token check"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: goushibaaz-rubika-preflight
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate Rubika bot token and optionally test channel posting
        env:
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
          RUBIKA_CHAT_ID: ${{ secrets.RUBIKA_CHAT_ID }}
          SEND_TEST_MESSAGE: ${{ inputs.send_test_message }}
          DISCOVER_RECENT_UPDATES: ${{ inputs.discover_recent_updates }}
        run: |
          node <<'NODE'
          const token = process.env.RUBIKA_BOT_TOKEN || '';
          const chatId = process.env.RUBIKA_CHAT_ID || '';
          if (!token) {
            console.error('RUBIKA_PREFLIGHT_FAILED: missing GitHub Actions secret RUBIKA_BOT_TOKEN');
            process.exit(1);
          }
          const base = 'https://botapi.rubika.ir/v3/' + encodeURIComponent(token);
          async function call(method, body) {
            const response = await fetch(base + '/' + method, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify(body || {}),
              signal: AbortSignal.timeout(20000)
            });
            const text = await response.text();
            let data;
            try { data = JSON.parse(text); } catch { data = { raw: text.slice(0, 300) }; }
            if (!response.ok || data.status !== 'OK') {
              const safe = { httpStatus: response.status, status: data.status || 'unknown', error: data.description || data.error || 'request_failed' };
              console.error('RUBIKA_API_ERROR', JSON.stringify(safe));
              process.exit(1);
            }
            return data;
          }
          (async () => {
            const me = await call('getMe');
            const bot = me.data?.bot || me.data || {};
            console.log('RUBIKA_TOKEN_VALID', JSON.stringify({
              botId: bot.bot_id || bot.id || null,
              botUsername: bot.username || bot.name || null
            }));
            if (process.env.DISCOVER_RECENT_UPDATES === 'true') {
              const result = await call('getUpdates', { limit: 10 });
              const updates = result.data?.updates || result.updates || [];
              const summary = updates.map(update => ({
                type: update.type || null,
                chatId: update.chat_id || null,
                senderType: update.new_message?.sender_type || null,
                hasNewMessage: Boolean(update.new_message)
              }));
              console.log('RUBIKA_RECENT_CHAT_IDS', JSON.stringify(summary));
              if (!summary.length) {
                console.log('RUBIKA_NO_RECENT_UPDATES: Send a test message to the bot or post a channel message that mentions the bot, then run discovery again.');
              }
            }
            if (process.env.SEND_TEST_MESSAGE === 'true') {
              if (!chatId) {
                console.error('RUBIKA_PREFLIGHT_FAILED: missing GitHub Actions secret RUBIKA_CHAT_ID');
                process.exit(1);
              }
              const sent = await call('sendMessage', {
                chat_id: chatId,
                text: 'گوشی‌باز: پیام آزمایشی اتصال روبیکا. برای بررسی اتصال ارسال شده است.'
              });
              const message = sent.data?.message || sent.data || {};
              console.log('RUBIKA_TEST_MESSAGE_ACCEPTED', JSON.stringify({
                messageId: message.message_id || message.id || null,
                chatId: chatId
              }));
            } else {
              console.log('RUBIKA_POST_TEST_SKIPPED: token checked only; no message was sent.');
            }
          })().catch(error => {
            console.error('RUBIKA_PREFLIGHT_FAILED', String(error.message || error).slice(0, 240));
            process.exit(1);
          });
          NODE
