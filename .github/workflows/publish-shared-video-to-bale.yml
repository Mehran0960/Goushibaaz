name: Publish Shared Video to Bale
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID of the preparation workflow that uploaded the shared artifact"
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: goushibaaz-bale-destination
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Download the exact shared candidate artifact
        id: artifact
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: goushibaaz-shared-candidate
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: work/shared-publish
      - name: Validate and independently publish to Bale
        if: steps.artifact.outcome == 'success'
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
          GOUSHIBAAZ_PUBLIC_PUBLISH_ENABLED: "true"
          GOUSHIBAAZ_FIRST_PUBLICATION_APPROVED: "true" # explicitly opened by the channel owner
        run: |
          node --check scripts/platform_publish.cjs
          node --check scripts/bale_publish.cjs
          node scripts/bale_publish.cjs
      - name: Persist Bale-only publication state
        if: ${{ always() && steps.artifact.outcome == 'success' && hashFiles('state/bale-published.json') != '' }}
        run: bash scripts/persist_state_file.sh state/bale-published.json "Record Bale destination result"
