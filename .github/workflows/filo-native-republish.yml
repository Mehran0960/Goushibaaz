name: Filo native authorized republisher

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/filo-native-republish.yml
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: filo-native-republish
  cancel-in-progress: false

jobs:
  republish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      # Reuse browser assets so each five-minute scan starts quickly.
      - name: Restore publisher tool caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.npm
          key: ${{ runner.os }}-filo-native-tools-v2
          restore-keys: |
            ${{ runner.os }}-filo-native-tools-v2-

      - name: Install browser and validate the Filo publisher
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright >/dev/null
          npx playwright install chromium >/dev/null
          node --check scripts/filo_native_republish.cjs
          node scripts/test_filo_native_republish.cjs

      - name: Record native Filo scheduler trigger diagnostics
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          echo "runner_utc=$(date -u +%FT%TZ)"

      - name: Discover Filo videos with native repost permission and publish one
        env:
          FILO_USER: ${{ secrets.FILO_USER }}
          FILO_PASS: ${{ secrets.FILO_PASS }}
        run: node scripts/filo_native_republish.cjs

      - name: Persist idempotency ledger after a submission
        if: always()
        run: bash scripts/persist_state_file.sh state/filo-native-republished.json "Record Filo native republish state [skip ci]"

      - name: Save execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filo-native-republish-${{ github.run_id }}
          path: out/filo-native-republish.json
          if-no-files-found: warn
          retention-days: 14
