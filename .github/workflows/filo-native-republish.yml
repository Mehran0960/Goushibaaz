name: Filo native authorized republisher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/filo-native-republish.yml"
      - "scripts/filo_native_republish.cjs"
      - "scripts/test_filo_native_republish.cjs"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: filo-native-republish
  cancel-in-progress: false

jobs:
  republish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install browser runtime and validate the publisher
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          npm init -y >/dev/null
          npm install --no-save playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node --check scripts/filo_native_republish.cjs
          node scripts/test_filo_native_republish.cjs

      - name: Discover Filo videos with native repost permission and publish one
        env:
          FILO_USER: ${{ secrets.FILO_USER }}
          FILO_PASS: ${{ secrets.FILO_PASS }}
        run: node scripts/filo_native_republish.cjs

      - name: Persist idempotency ledger after a submission
        if: always()
        run: bash scripts/persist_state_file.sh state/filo-native-republished.json "Record Filo native republish state"

      - name: Save execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filo-native-republish-${{ github.run_id }}
          path: out/filo-native-republish.json
          if-no-files-found: warn
          retention-days: 14
