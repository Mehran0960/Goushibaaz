name: Filo native authorized republisher

on:
  pull_request:
    paths:
      - "scripts/filo_native_republish.cjs"
      - "scripts/test_filo_native_republish.cjs"
      - ".github/workflows/filo-native-republish.yml"
      - "docs/FILO-NATIVE-REPUBLICATION.md"
      - "docs/CHANGELOG.md"
      - ".github/pull_request_template.md"
      - "README.md"
  # Native five-minute trigger; workflow_dispatch remains available for manual or authorized external dispatch.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: filo-native-republish-${{ github.event_name == 'pull_request' && github.run_id || 'publisher' }}
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enforce documentation for native publisher changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/filo-changed-files.txt"
          if grep -Eq '^(scripts/filo_native_republish\.cjs|scripts/test_filo_native_republish\.cjs|\.github/workflows/filo-native-republish\.yml)        run: |
          npm init -y >/dev/null
          npm install --no-save playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Check syntax and run regression tests
        run: |
          node --check scripts/filo_native_republish.cjs
          node scripts/test_filo_native_republish.cjs

  republish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      # Reuse browser assets so each dispatched scan starts quickly.
      - name: Restore publisher tool caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.npm
          key: ${{ runner.os }}-filo-native-tools-v2
          restore-keys: |
            ${{ runner.os }}-filo-native-tools-v2-

      - name: Install browser and validate the Filo publisher
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright >/dev/null
          npx playwright install chromium >/dev/null
          node --check scripts/filo_native_republish.cjs
          node scripts/test_filo_native_republish.cjs

      - name: Record native Filo scheduler trigger diagnostics
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "runner_utc=$(date -u +%FT%TZ)"

      - name: Discover Filo videos with native repost permission and publish one
        env:
          FILO_USER: ${{ secrets.FILO_USER }}
          FILO_PASS: ${{ secrets.FILO_PASS }}
        run: node scripts/filo_native_republish.cjs

      - name: Persist idempotency ledger after a submission
        if: always()
        run: bash scripts/persist_state_file.sh state/filo-native-republished.json "Record Filo native republish state [skip ci]"

      - name: Save execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filo-native-republish-${{ github.run_id }}
          path: out/filo-native-republish.json
          if-no-files-found: warn
          retention-days: 14
 "$RUNNER_TEMP/filo-changed-files.txt"; then
            if ! grep -Fxq 'docs/CHANGELOG.md' "$RUNNER_TEMP/filo-changed-files.txt"; then
              echo "::error::Native Filo code/workflow changes require an entry in docs/CHANGELOG.md."
              exit 1
            fi
          fi

      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Check syntax and run regression tests
        run: |
          node --check scripts/filo_native_republish.cjs
          node scripts/test_filo_native_republish.cjs

  republish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      # Reuse browser assets so each dispatched scan starts quickly.
      - name: Restore publisher tool caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.npm
          key: ${{ runner.os }}-filo-native-tools-v2
          restore-keys: |
            ${{ runner.os }}-filo-native-tools-v2-

      - name: Install browser and validate the Filo publisher
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright >/dev/null
          npx playwright install chromium >/dev/null
          node --check scripts/filo_native_republish.cjs
          node scripts/test_filo_native_republish.cjs

      - name: Record native Filo scheduler trigger diagnostics
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "runner_utc=$(date -u +%FT%TZ)"

      - name: Discover Filo videos with native repost permission and publish one
        env:
          FILO_USER: ${{ secrets.FILO_USER }}
          FILO_PASS: ${{ secrets.FILO_PASS }}
        run: node scripts/filo_native_republish.cjs

      - name: Persist idempotency ledger after a submission
        if: always()
        run: bash scripts/persist_state_file.sh state/filo-native-republished.json "Record Filo native republish state [skip ci]"

      - name: Save execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filo-native-republish-${{ github.run_id }}
          path: out/filo-native-republish.json
          if-no-files-found: warn
          retention-days: 14
