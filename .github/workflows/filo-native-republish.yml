name: Filo native authorized republisher

on:
  pull_request:
    paths:
      - "scripts/filo_native_republish.cjs"
      - "scripts/test_filo_native_republish.cjs"
      - "scripts/filo_publish_cc0.cjs"
      - "scripts/filo_publication_cadence.cjs"
      - "scripts/filo_thumbnail_overlay.cjs"
      - "scripts/test_filo_thumbnail_overlay.cjs"
      - "scripts/filo_external_ingest_due.cjs"
      - "scripts/filo_url_import.cjs"
      - "scripts/test_filo_url_import.cjs"
      - "scripts/test_filo_publication_cadence.cjs"
      - "scripts/test_filo_external_ingest_due.cjs"
      - ".github/workflows/publish-approved-video-to-filo.yml"
      - "docs/FILO-INBOUND-INGESTION-ROADMAP.md"
      - ".github/workflows/filo-native-republish.yml"
      - ".github/workflows/validate-filo-native-republish.yml"
      - "docs/FILO-NATIVE-REPUBLICATION.md"
      - "docs/CHANGELOG.md"
      - ".github/pull_request_template.md"
      - "README.md"
  # Native five-minute trigger; workflow_dispatch remains available for manual or authorized external dispatch.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: filo-native-republish-${{ github.event_name == 'pull_request' && github.run_id || 'publisher' }}
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enforce documentation for native publisher changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/filo-changed-files.txt"
          if grep -Eq '^(scripts/filo_native_republish\.cjs|scripts/test_filo_native_republish\.cjs|scripts/filo_publish_cc0\.cjs|scripts/filo_publication_cadence\.cjs|scripts/filo_thumbnail_overlay\.cjs|scripts/test_filo_thumbnail_overlay\.cjs|scripts/filo_external_ingest_due\.cjs|scripts/filo_url_import\.cjs|scripts/test_filo_url_import\.cjs|scripts/test_filo_publication_cadence\.cjs|scripts/test_filo_external_ingest_due\.cjs|\.github/workflows/filo-native-republish\.yml|\.github/workflows/validate-filo-native-republish\.yml|\.github/workflows/publish-approved-video-to-filo\.yml)$' "$RUNNER_TEMP/filo-changed-files.txt"; then
            if ! grep -Fxq 'docs/CHANGELOG.md' "$RUNNER_TEMP/filo-changed-files.txt"; then
              echo "::error::Native Filo code/workflow changes require an entry in docs/CHANGELOG.md."
              exit 1
            fi
          fi
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Check syntax and run regression tests
        run: |
          node --check scripts/filo_native_republish.cjs
          node scripts/test_filo_native_republish.cjs
          node --check scripts/filo_publish_cc0.cjs
          node --check scripts/filo_publication_cadence.cjs
          node --check scripts/filo_thumbnail_overlay.cjs
          node scripts/test_filo_thumbnail_overlay.cjs
          node --check scripts/filo_external_ingest_due.cjs
          node --check scripts/filo_url_import.cjs
          node scripts/test_filo_url_import.cjs
          node scripts/test_filo_publication_cadence.cjs
          node scripts/test_filo_external_ingest_due.cjs

  republish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      # Reuse browser assets so each dispatched scan starts quickly.
      - name: Restore publisher tool caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.npm
          key: ${{ runner.os }}-filo-native-tools-v2
          restore-keys: |
            ${{ runner.os }}-filo-native-tools-v2-

      - name: Install browser and validate the Filo publisher
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright >/dev/null
          npx playwright install chromium >/dev/null
          node --check scripts/filo_native_republish.cjs
          node --check scripts/filo_publish_cc0.cjs
          node --check scripts/filo_publication_cadence.cjs
          node --check scripts/filo_external_ingest_due.cjs
          node --check scripts/filo_url_import.cjs
          node scripts/test_filo_url_import.cjs
          node scripts/test_filo_native_republish.cjs
          node scripts/test_filo_publication_cadence.cjs
          node scripts/test_filo_external_ingest_due.cjs
      - name: Record native Filo scheduler trigger diagnostics
        env:
          WORKFLOW_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY_REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "actor=$WORKFLOW_ACTOR"
          echo "triggering_actor=$TRIGGERING_ACTOR"
          echo "ref=$REPOSITORY_REF"
          echo "run_id=$RUN_ID"
          echo "run_attempt=$RUN_ATTEMPT"
          echo "runner_utc=$(date -u +%FT%TZ)"

      - name: Discover Filo videos with native repost permission and publish one
        id: republish
        env:
          FILO_USER: ${{ secrets.FILO_USER }}
          FILO_PASS: ${{ secrets.FILO_PASS }}
        run: node scripts/filo_native_republish.cjs

      - name: Check whether the independent licensed-source scan is due
        id: external_due
        if: steps.republish.outcome == 'success'
        run: node scripts/filo_external_ingest_due.cjs

      - name: Search Filo global catalog using current Iranian trends
        id: global_filo_search
        if: steps.external_due.outputs.due == 'true'
        continue-on-error: true
        env:
          FILO_USER: ${{ secrets.FILO_USER }}
          FILO_PASS: ${{ secrets.FILO_PASS }}
        run: node scripts/filo_trend_search_worker.cjs

      - name: Persist global Filo trend-search observations
        if: always() && steps.external_due.outputs.due == 'true'
        run: bash scripts/persist_state_file.sh state/filo-global-search-candidates.json "Record global Filo trend-search observations [skip ci]"

      - name: Install FFmpeg and fonts for external video preparation
        if: steps.external_due.outputs.due == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core

      - name: Independently search Persian trend-led open-license sources and publish one eligible video
        if: steps.external_due.outputs.due == 'true'
        env:
          FILO_USER: ${{ secrets.FILO_USER }}
          FILO_PASS: ${{ secrets.FILO_PASS }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY || vars.PEXELS_API_KEY }}
          PEXELS_AUTOMATED_REPUBLISH_APPROVED: ${{ vars.PEXELS_AUTOMATED_REPUBLISH_APPROVED || 'false' }}
        run: node scripts/filo_publish_cc0.cjs

      - name: Persist external scan cadence
        if: always() && steps.external_due.outputs.due == 'true'
        run: bash scripts/persist_state_file.sh state/filo-external-ingest-schedule.json "Record Filo external ingestion scan cadence [skip ci]"

      - name: Persist licensed external publication ledger
        if: always() && steps.external_due.outputs.due == 'true'
        run: bash scripts/persist_state_file.sh state/filo-published.json "Record Filo licensed external publication state [skip ci]"

      - name: Persist idempotency ledger after a submission
        if: always()
        run: bash scripts/persist_state_file.sh state/filo-native-republished.json "Record Filo native republish state [skip ci]"
      - name: Save execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filo-native-republish-${{ github.run_id }}
          path: |
            out/filo-native-republish.json
            out/filo-global-search-worker.json
          if-no-files-found: warn
          retention-days: 14
