name: Filo native authorized republisher

on:
  workflow_dispatch:
  schedule:
    # Ten-minute cadence: leaves a margin over the longest recent full run (6m12s).
    - cron: "3,13,23,33,43,53 * * * *"
  push:
    branches: [main]
    paths:
      - "state/filo-native-republish-activation.json"

permissions:
  contents: write

concurrency:
  group: filo-native-republish
  cancel-in-progress: false

jobs:
  republish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      # Browser and Python wheel caches prevent the five-minute publisher from spending
      # most of each slot reinstalling the same toolchain.
      - name: Restore publisher tool caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
            ~/.npm
          key: ${{ runner.os }}-filo-native-tools-v1-${{ hashFiles('scripts/score_filo_thumbnail.py') }}
          restore-keys: |
            ${{ runner.os }}-filo-native-tools-v1-

      - name: Install only missing runtime dependencies and validate the publisher
        run: |
          if ! command -v ffprobe >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python3 -m pip install --quiet --break-system-packages mediapipe==0.10.21
          npm init -y >/dev/null
          npm install --no-save playwright >/dev/null
          npx playwright install chromium >/dev/null
          node --check scripts/filo_native_republish.cjs
          node scripts/test_filo_native_republish.cjs
          node --check scripts/google_trends_iran.cjs
          node --check scripts/test_google_trends_iran.cjs
          node scripts/test_google_trends_iran.cjs
          node --check scripts/filo_global_search.cjs
          node --check scripts/test_filo_global_search.cjs
          node scripts/test_filo_global_search.cjs
          python3 scripts/test_filo_thumbnail.py

      - name: Record native Filo scheduler trigger diagnostics
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          echo "runner_utc=$(date -u +%FT%TZ)"

      - name: Discover Filo videos with native repost permission and publish one
        env:
          FILO_USER: ${{ secrets.FILO_USER }}
          FILO_PASS: ${{ secrets.FILO_PASS }}
        run: node scripts/filo_native_republish.cjs

      - name: Persist idempotency ledger after a submission
        if: always()
        run: bash scripts/persist_state_file.sh state/filo-native-republished.json "Record Filo native republish state"

      - name: Save execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filo-native-republish-${{ github.run_id }}
          path: out/filo-native-republish.json
          if-no-files-found: warn
          retention-days: 14
