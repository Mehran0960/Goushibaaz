name: Filo exhaustive Google Trends search worker

on:
  workflow_dispatch:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/filo-trend-search.yml"
      - "scripts/filo_trend_search_worker.cjs"
      - "scripts/test_filo_trend_search_worker.cjs"
      - "scripts/filo_global_search.cjs"
      - "scripts/test_filo_global_search.cjs"
      - "scripts/google_trends_iran.cjs"
      - "scripts/filo_native_republish.cjs"

permissions:
  contents: write

concurrency:
  group: goushibaaz-filo-exhaustive-trend-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install browser runtime and validate the resumable search worker
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node --check scripts/google_trends_iran.cjs
          node --check scripts/filo_global_search.cjs
          node --check scripts/filo_native_republish.cjs
          node --check scripts/filo_trend_search_worker.cjs
          node scripts/test_google_trends_iran.cjs
          node scripts/test_filo_global_search.cjs
          node scripts/test_filo_trend_search_worker.cjs

      - name: Continue searching all pages for current Iranian trend topics
        env:
          FILO_USER: ${{ secrets.FILO_USER }}
          FILO_PASS: ${{ secrets.FILO_PASS }}
        run: node scripts/filo_trend_search_worker.cjs

      - name: Persist search cursors and candidate cache
        if: always()
        run: bash scripts/persist_state_file.sh state/filo-global-search-candidates.json "Persist resumable Filo trend search"

      - name: Save search report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filo-global-search-${{ github.run_id }}
          path: out/filo-global-search-worker.json
          if-no-files-found: warn
          retention-days: 7
