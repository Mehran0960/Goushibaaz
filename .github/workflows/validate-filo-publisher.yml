name: Validate Goushibaaz discovery and publishers

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/validate-filo-publisher.yml"
      - "scripts/filo_publish_cc0.cjs"
      - "scripts/editorial_content.cjs"
      - "scripts/test_editorial_content.cjs"
      - "scripts/filo_endcard.cjs"
      - "scripts/test_filo_endcard.cjs"
      - "scripts/platform_scout.cjs"
      - "scripts/rubika_publish_cc0.cjs"
      - "scripts/rubika_publish_shared.cjs"
      - "scripts/platform_publish.cjs"
      - "scripts/telegram_publish.cjs"
      - "scripts/bale_publish.cjs"
      - "scripts/test_shared_publish.cjs"
      - "scripts/persist_state_file.sh"
      - "scripts/import_trend_intelligence.cjs"
      - "scripts/trend_intelligence/**"
      - "scripts/synchronized_scheduler.cjs"
      - "scripts/quality_rank.cjs"
      - "scripts/test_quality_rank.cjs"
      - "scripts/media_format.cjs"
      - "scripts/test_media_format.cjs"
      - "scripts/trend_discovery.cjs"
      - "scripts/test_trend_discovery.cjs"
      - ".github/workflows/discover-filo-candidates.yml"
      - ".github/workflows/publish-approved-video-to-filo.yml"
      - ".github/workflows/publish-approved-video-to-rubika.yml"
      - ".github/workflows/prepare-shared-video.yml"
      - ".github/workflows/publish-shared-video-to-rubika.yml"
      - ".github/workflows/publish-shared-video-to-telegram.yml"
      - ".github/workflows/publish-shared-video-to-bale.yml"
      - ".github/workflows/trend-intelligence.yml"
      - ".github/workflows/dispatch-short-publishers.yml"
      - ".github/workflows/deploy-goushibaaz.yml"
      - "config/content-policy.json"
      - "cloudflare/**"
      - "scripts/original_puzzle_video.cjs"
      - "scripts/test_original_puzzle_video.cjs"

permissions:
  contents: read

concurrency:
  group: goushibaaz-publisher-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install FFmpeg and Persian fonts for end-card regression
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
      - name: Validate JavaScript and shell syntax
        run: |
          node --check scripts/filo_publish_cc0.cjs
          node --check scripts/editorial_content.cjs
          node --check scripts/test_editorial_content.cjs
          node --check scripts/filo_endcard.cjs
          node --check scripts/test_filo_endcard.cjs
          node --check scripts/platform_publish.cjs
          node --check scripts/telegram_publish.cjs
          node --check scripts/bale_publish.cjs
          node --check scripts/rubika_publish_shared.cjs
          node --check scripts/test_shared_publish.cjs
          node --check scripts/media_format.cjs
          node --check scripts/rubika_publish_cc0.cjs
          node --check scripts/import_trend_intelligence.cjs
          node --check scripts/synchronized_scheduler.cjs
          node --check scripts/quality_rank.cjs
          node --check scripts/test_quality_rank.cjs
          node --check scripts/trend_discovery.cjs
          node --check scripts/test_trend_discovery.cjs
          node --check scripts/platform_scout.cjs
          node --check scripts/license_check.cjs
          node --check scripts/original_puzzle_video.cjs
          node --check scripts/test_original_puzzle_video.cjs
          node --check cloudflare/src/index.js
          node --check scripts/merge_short_candidates.cjs
          bash -n scripts/persist_state_file.sh
      - name: Run JavaScript regression tests
        run: |
          node scripts/test_editorial_content.cjs
          node scripts/test_filo_endcard.cjs
          node scripts/test_shared_publish.cjs
          node scripts/test_media_format.cjs
          node scripts/test_quality_rank.cjs
          node scripts/test_trend_discovery.cjs
      - name: Validate destination wiring and publishing-policy invariants
        run: |
          set -euo pipefail
          check_contains() {
            local file="$1"; local expected="$2"
            if ! grep -Fq -- "$expected" "$file"; then
              echo "::error file=$file::Missing expected text: $expected"
              exit 1
            fi
            echo "CHECK_OK contains $file :: $expected"
          }
          check_absent() {
            local file="$1"; local forbidden="$2"
            if grep -Fq -- "$forbidden" "$file"; then
              echo "::error file=$file::Forbidden text still present: $forbidden"
              exit 1
            fi
            echo "CHECK_OK absent $file :: $forbidden"
          }
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const policy = JSON.parse(fs.readFileSync('config/content-policy.json', 'utf8'));
          assert.equal(policy.vertical_video.aspect_ratio, '9:16');
          assert.ok(policy.platform_profiles && policy.platform_profiles.filo);
          console.log('CONTENT_POLICY_JSON_OK');
          NODE
          check_contains .github/workflows/dispatch-short-publishers.yml '    - cron: "*/5 * * * *"'
          check_contains scripts/synchronized_scheduler.cjs 'const INTERVALS = [5, 10, 15, 20, 25, 30'
          check_contains scripts/synchronized_scheduler.cjs 'const MAX_DESTINATION_STARTS_PER_UTC_DAY = 1200;'
          check_contains scripts/synchronized_scheduler.cjs 'const FUTURE_PLATFORM_RESERVE = 3;'
          check_contains scripts/synchronized_scheduler.cjs 'Promise.all(planned.map(dispatchOne))'
          check_contains .github/workflows/dispatch-short-publishers.yml 'actions/cache/restore@v6'
          check_contains .github/workflows/dispatch-short-publishers.yml 'actions/cache/save@v6'
          check_contains .github/workflows/dispatch-short-publishers.yml 'key: goushibaaz-publisher-schedule-v2-${{ github.run_id }}-${{ github.run_attempt }}'
          check_absent scripts/synchronized_scheduler.cjs 'publish-approved-video-to-filo.yml'
          check_contains scripts/synchronized_scheduler.cjs 'prepare-shared-video.yml'
          check_contains scripts/synchronized_scheduler.cjs 'slow Telegram/Bale/Rubika delivery must never freeze fresh discovery slots'
          check_absent scripts/synchronized_scheduler.cjs 'publish-approved-video-to-rubika.yml'
          check_contains .github/workflows/publish-shared-video-to-telegram.yml 'workflow_dispatch:'
          check_contains .github/workflows/publish-shared-video-to-telegram.yml 'source_run_id:'
          check_contains .github/workflows/publish-shared-video-to-telegram.yml 'run-id: ${{ inputs.source_run_id }}'
          check_contains .github/workflows/publish-shared-video-to-telegram.yml 'actions/download-artifact@v8'
          check_contains .github/workflows/publish-shared-video-to-telegram.yml 'TELEGRAM_BOT_TOKEN:'
          check_contains .github/workflows/publish-shared-video-to-telegram.yml 'secrets.TELEGRAM_BOT_TOKEN'
          check_contains .github/workflows/publish-shared-video-to-telegram.yml 'GOUSHIBAAZ_PUBLIC_PUBLISH_ENABLED: "true"'
          check_contains .github/workflows/publish-shared-video-to-telegram.yml 'GOUSHIBAAZ_FIRST_PUBLICATION_APPROVED: "true"'
          check_contains .github/workflows/publish-shared-video-to-telegram.yml 'bash scripts/persist_state_file.sh state/telegram-published.json'
          check_absent .github/workflows/publish-shared-video-to-telegram.yml 'Telegram publishing is disabled by project policy'
          check_contains .github/workflows/publish-shared-video-to-rubika.yml 'workflow_dispatch:'
          check_contains .github/workflows/publish-shared-video-to-rubika.yml 'source_run_id:'
          check_contains .github/workflows/publish-shared-video-to-rubika.yml 'run-id: ${{ inputs.source_run_id }}'
          check_contains .github/workflows/publish-shared-video-to-bale.yml 'actions/download-artifact@v8'
                    check_contains .github/workflows/publish-shared-video-to-bale.yml 'workflow_dispatch:'
                    check_contains .github/workflows/publish-shared-video-to-bale.yml 'source_run_id:'
                    check_contains .github/workflows/publish-shared-video-to-bale.yml 'run-id: ${{ inputs.source_run_id }}'
                    check_contains .github/workflows/prepare-shared-video.yml 'actions: write'
                    check_contains .github/workflows/prepare-shared-video.yml 'Dispatch Telegram, Bale and Rubika independently'
                    check_contains .github/workflows/prepare-shared-video.yml 'Promise.all(workflows.map(dispatch))'
                    check_contains scripts/platform_publish.cjs "entry.status = 'failed_retryable';"
                    check_contains scripts/filo_publish_cc0.cjs "status: 'failed_retryable'"
          check_contains scripts/platform_publish.cjs 'GOUSHIBAAZ_FIRST_PUBLICATION_APPROVED'
          check_contains scripts/rubika_publish_shared.cjs 'GOUSHIBAAZ_FIRST_PUBLICATION_APPROVED'
          check_contains .github/workflows/publish-shared-video-to-rubika.yml 'GOUSHIBAAZ_FIRST_PUBLICATION_APPROVED: "true"'
          check_contains .github/workflows/publish-shared-video-to-bale.yml 'GOUSHIBAAZ_FIRST_PUBLICATION_APPROVED: "true"'
          check_contains .github/workflows/deploy-goushibaaz.yml 'cloudflare/wrangler-action@v4'
          check_contains .github/workflows/discover-filo-candidates.yml 'group: goushibaaz-trend-state-writers'
          check_contains .github/workflows/trend-intelligence.yml 'group: goushibaaz-trend-state-writers'
          check_contains .github/workflows/discover-filo-candidates.yml 'if ! git rebase origin/main'
          check_contains .github/workflows/trend-intelligence.yml 'if ! git rebase origin/main'
          check_contains scripts/filo_publish_cc0.cjs 'const MIN_DURATION_SECONDS = 8;'
          check_contains scripts/rubika_publish_cc0.cjs 'const MIN_DURATION_SECONDS = 8;'
          check_contains scripts/filo_publish_cc0.cjs 'FILO_EDITORIAL_RANKING'
          check_contains scripts/rubika_publish_cc0.cjs 'RUBIKA_CONTENT_PRIORITY'
          node -e "const p=require('./config/content-policy.json'); const f=p.platform_profiles&&p.platform_profiles.filo; if(p.vertical_video.aspect_ratio!=='9:16'||p.vertical_video.output_width!==1080||p.vertical_video.output_height!==1920||!f||f.output_width!==720||f.output_height!==1280||f.cover_width!==720||f.cover_height!==1280||f.end_card_seconds!==1.6) process.exit(1); console.log('CONTENT_POLICY_CHECK_OK')"
          check_contains .github/workflows/publish-approved-video-to-filo.yml 'cron: "*/5 * * * *"'
          check_contains .github/workflows/publish-approved-video-to-filo.yml 'five-minute best-effort attempts'
          check_contains scripts/filo_publish_cc0.cjs 'MAX_DAILY_PUBLICATIONS = 288'
          check_contains scripts/filo_publish_cc0.cjs 'MIN_PUBLICATION_GAP_MS = 5 * 60 * 1000'
          check_contains scripts/filo_publish_cc0.cjs 'buildTrendSearches()'
          check_contains scripts/rubika_publish_cc0.cjs 'rotateSearchBatch'
          check_contains scripts/quality_rank.cjs 'observed_trend_title_overlap'
          check_contains config/content-policy.json 'never_crop_foreground'
          check_contains config/content-policy.json 'nasa_public_media_enabled_for_public_entertainment'
          check_contains scripts/quality_rank.cjs 'technology_demo'
          check_contains scripts/media_format.cjs 'source_audio_track_missing'
          check_contains scripts/rubika_publish_cc0.cjs 'fit_foreground_with_blurred_background'
          check_contains scripts/filo_publish_cc0.cjs 'fit_foreground_with_blurred_background'
          check_absent scripts/rubika_publish_cc0.cjs 'const nasaCandidates = await discoverNasaCandidates(used)'
          check_contains scripts/rubika_publish_cc0.cjs 'NASA_PUBLIC_MEDIA_SKIPPED_FOR_ENTERTAINMENT_FIT'
          check_absent scripts/rubika_publish_cc0.cjs "'-an'"
          check_absent scripts/filo_publish_cc0.cjs 'licenseurl:http*creativecommons.org/publicdomain/zero/1.0*'
          check_absent scripts/rubika_publish_cc0.cjs 'licenseurl:http*creativecommons.org/publicdomain/zero/1.0*'
          check_contains scripts/filo_publish_cc0.cjs 'internetArchiveLicense(meta.licenseurl || entry.indexed.licenseurl)'
          check_contains scripts/rubika_publish_cc0.cjs 'internetArchiveLicense(meta.licenseurl || entry.indexed.licenseurl)'
      - name: Validate Python trend-intelligence modules and scoring tests
        run: |
          python --version
          python -m pip install --disable-pip-version-check requests
          python -m py_compile scripts/trend_intelligence/follower_growth.py scripts/trend_intelligence/social_discovery.py scripts/trend_intelligence/run_discovery.py scripts/trend_intelligence/build_preview.py scripts/trend_intelligence/test_follower_growth.py scripts/trend_intelligence/test_social_discovery.py
          python -m unittest -v scripts/trend_intelligence/test_follower_growth.py
          python -m unittest -v scripts/trend_intelligence/test_social_discovery.py
      - name: Validate Cloudflare D1 migrations against the checked-in schema
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          def snapshot(connection):
              # SQLite ALTER TABLE appends columns, so physical column order is not
              # part of the schema contract. Compare column definitions by name.
              tables = [row[0] for row in connection.execute(
                  "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name"
              )]
              result = {}
              for table in tables:
                  columns = {}
                  for row in connection.execute(f'PRAGMA table_info("{table}")'):
                      columns[row[1]] = {
                          'type': (row[2] or '').upper().strip(),
                          'not_null': bool(row[3]),
                          'default': row[4],
                          'primary_key_position': row[5],
                      }

                  indexes = {}
                  for row in connection.execute(f'PRAGMA index_list("{table}")'):
                      _, name, unique, origin, partial = row
                      indexed_columns = [
                          (column[2], bool(column[3]), column[4])
                          for column in connection.execute(f'PRAGMA index_xinfo("{name}")')
                          if column[5]
                      ]
                      indexes[name] = {
                          'unique': bool(unique),
                          'origin': origin,
                          'partial': bool(partial),
                          'columns': indexed_columns,
                      }

                  foreign_keys = sorted(
                      tuple(row)
                      for row in connection.execute(f'PRAGMA foreign_key_list("{table}")')
                  )
                  result[table] = {
                      'columns': columns,
                      'indexes': indexes,
                      'foreign_keys': foreign_keys,
                  }
              return result

          migrated = sqlite3.connect(':memory:')
          migrated.execute('PRAGMA foreign_keys = ON')
          migrations = sorted(Path('cloudflare/migrations').glob('*.sql'))
          if not migrations:
              raise SystemExit('No Cloudflare D1 migrations found')
          for migration in migrations:
              migrated.executescript(migration.read_text(encoding='utf-8'))
              print(f'D1_MIGRATION_OK {migration.as_posix()}')

          reference = sqlite3.connect(':memory:')
          reference.execute('PRAGMA foreign_keys = ON')
          reference.executescript(Path('cloudflare/schema.sql').read_text(encoding='utf-8'))
          migrated_snapshot = snapshot(migrated)
          reference_snapshot = snapshot(reference)
          if migrated_snapshot != reference_snapshot:
              all_tables = sorted(set(migrated_snapshot) | set(reference_snapshot))
              for table in all_tables:
                  if migrated_snapshot.get(table) != reference_snapshot.get(table):
                      print(f'D1_SCHEMA_DIFF table={table}')
              raise SystemExit('D1 migrations do not match cloudflare/schema.sql')
          if migrated.execute('PRAGMA integrity_check').fetchone()[0] != 'ok':
              raise SystemExit('D1 migration database failed integrity_check')
          if migrated.execute('PRAGMA foreign_key_check').fetchall():
              raise SystemExit('D1 migration database failed foreign_key_check')
          print('D1_SCHEMA_AND_MIGRATIONS_OK')
          PY
      - name: Test public commercial-license video discovery (no upload)
        run: |
          node <<'NODE'
          const queries = [
            'filetype:video cat',
            'filetype:video dog',
            'filetype:video pet',
            'filetype:video bird'
          ];
          const clean = value => String(value || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
          (async () => {
            let total = 0, videoWebm = 0, verifiedCc0Webm = 0, verifiedCcBy4Webm = 0, verifiedCommercialWebm = 0, eligibleShorts = 0;
            const report = [];
            for (const query of queries) {
              const url = new URL('https://commons.wikimedia.org/w/api.php');
              url.searchParams.set('action', 'query');
              url.searchParams.set('format', 'json');
              url.searchParams.set('generator', 'search');
              url.searchParams.set('gsrnamespace', '6');
              url.searchParams.set('gsrlimit', '50');
              url.searchParams.set('gsrsearch', query);
              url.searchParams.set('prop', 'imageinfo');
              url.searchParams.set('iiprop', 'url|mime|size|extmetadata|commonmetadata');
              const response = await fetch(url, {
                headers: { 'User-Agent': 'GoushibaazFiloPublisherValidation/1.0' },
                signal: AbortSignal.timeout(18000)
              });
              if (!response.ok) throw new Error('commons_http_' + response.status + '_' + query);
              const payload = await response.json();
              const pages = Object.values(payload.query && payload.query.pages || {});
              let queryVideos = 0, queryCc0 = 0, queryCcBy4 = 0, queryEligible = 0;
              for (const page of pages) {
                total++;
                const info = page.imageinfo && page.imageinfo[0];
                if (!info || info.mime !== 'video/webm') continue;
                videoWebm++; queryVideos++;
                const meta = info.extmetadata || {};
                const licenseName = clean(meta.LicenseShortName && meta.LicenseShortName.value);
                const licenseUrl = clean(meta.LicenseUrl && meta.LicenseUrl.value);
                const cc0 = /\bCC0\b/i.test(licenseName) && /creativecommons\.org\/publicdomain\/zero\/1\.0(?:\/|$)/i.test(licenseUrl);
                const ccBy4 = /\bCC BY 4\.0\b/i.test(licenseName) &&
                  /creativecommons\.org\/licenses\/by\/4\.0(?:\/|$)/i.test(licenseUrl) &&
                  !/creativecommons\.org\/licenses\/by-(?:nc|nd|sa)(?:-|\/)/i.test(licenseUrl);
                if (!cc0 && !ccBy4) continue;
                verifiedCommercialWebm++;
                if (cc0) { verifiedCc0Webm++; queryCc0++; }
                if (ccBy4) { verifiedCcBy4Webm++; queryCcBy4++; }
                if (!Number.isFinite(info.size) || info.size < 200000 || info.size > 45000000) continue;
                const description = clean(meta.ImageDescription && meta.ImageDescription.value);
                const text = (String(page.title || '') + ' ' + description).toLowerCase();
                if (!/\b(cat|cats|kitten|feline|dog|dogs|puppy|pet|pets|bird|birds|parrot|pigeon|squirrel|monkey|rabbit|animal|wildlife)\b|گربه|سگ|حیوان|پرنده/.test(text)) continue;
                const common = Array.isArray(info.commonmetadata) ? info.commonmetadata : [];
                let duration = null;
                for (const item of common) {
                  if (!/duration|length|runtime|run time/i.test(String(item.name || ''))) continue;
                  const v=String(item.value||'');
                  const m=v.match(/PT(?:(\d+(?:\.\d+)?)H)?(?:(\d+(?:\.\d+)?)M)?(?:(\d+(?:\.\d+)?)S)?/i);
                  if (m) duration=Number(m[1]||0)*3600+Number(m[2]||0)*60+Number(m[3]||0);
                }
                if (duration !== null && (duration < 3 || duration > 180)) continue;
                eligibleShorts++; queryEligible++;
              }
              report.push({ query, renderedResults: pages.length, videoWebm: queryVideos, cc0Webm: queryCc0, ccBy4Webm: queryCcBy4, eligibleAnimalShorts: queryEligible });
            }
            console.log('FILO_COMMERCIAL_LICENSE_DISCOVERY_VALIDATION', JSON.stringify({totalMetadataResults:total, videoWebm, verifiedCc0Webm, verifiedCcBy4Webm, verifiedCommercialWebm, eligibleShorts, report}));
            if (total === 0) throw new Error('commons_search_returned_no_metadata');
          })().catch(err => { console.error('FILO_CC0_DISCOVERY_FAILED', String(err && err.message || err).slice(0,180)); process.exit(1); });
          NODE
