name: Validate Filo native republisher

on:
  pull_request:
    paths:
      - "scripts/filo_native_republish.cjs"
      - "scripts/test_filo_native_republish.cjs"
      - ".github/workflows/filo-native-republish.yml"
      - ".github/workflows/filo-native-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Check syntax and run regression tests
        run: |
          node --check scripts/filo_native_republish.cjs
          node scripts/test_filo_native_republish.cjs
