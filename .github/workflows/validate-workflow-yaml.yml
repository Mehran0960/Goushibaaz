name: Validate all GitHub Actions workflow YAML

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse every workflow YAML file
        run: |
          ruby <<'RUBY'
          require "yaml"

          files = Dir.glob(".github/workflows/*.{yml,yaml}").sort
          abort "No GitHub Actions workflow YAML files found" if files.empty?

          files.each do |path|
            begin
              document = YAML.load_file(path, aliases: true)
            rescue Psych::SyntaxError => error
              warn "::error file=#{path}::#{error.message}"
              exit 1
            end

            unless document.is_a?(Hash) && document["jobs"].is_a?(Hash) && !document["jobs"].empty?
              abort "::error file=#{path}::Expected a workflow mapping with at least one job"
            end

            puts "WORKFLOW_YAML_OK #{path}"
          end
          RUBY
