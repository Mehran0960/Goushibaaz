name: Validate rights decision policy

on:
  pull_request:
    paths:
      - "config/content-policy.json"
      - "scripts/merge_short_candidates.cjs"
      - "scripts/test_rights_policy.cjs"
      - ".github/workflows/validate-rights-policy.yml"
  push:
    branches: [main]
    paths:
      - "config/content-policy.json"
      - "scripts/merge_short_candidates.cjs"
      - "scripts/test_rights_policy.cjs"
      - ".github/workflows/validate-rights-policy.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check candidate merge script
        run: node --check scripts/merge_short_candidates.cjs
      - name: Test rights decision states
        run: node scripts/test_rights_policy.cjs
      - name: Validate content policy JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('config/content-policy.json','utf8'))"
