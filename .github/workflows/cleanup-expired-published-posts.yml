name: Retain only recent Goushibaaz channel posts

on:
  pull_request:
    paths:
      - ".github/workflows/cleanup-expired-published-posts.yml"
      - "scripts/cleanup_published_retention.cjs"
      - "scripts/test_cleanup_published_retention.cjs"
  schedule:
    # Items become deletion-eligible at 46h; a 15-minute poll still leaves at least 1h45m before the 48h Bot API cutoff.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goushibaaz-retention-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate retention cleanup
        run: |
          node --check scripts/cleanup_published_retention.cjs
          node scripts/test_cleanup_published_retention.cjs

      - name: Delete expired posts independently on each supported destination
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
          RUBIKA_CHAT_ID: ${{ secrets.RUBIKA_CHAT_ID }}
          EITAAYAR_API_TOKEN: ${{ secrets.EITAAYAR_API_TOKEN }}
          EITAAYAR_CHAT_ID: ${{ secrets.EITAAYAR_CHAT_ID }}
          JETRA_BOT_TOKEN: ${{ secrets.JETRA_BOT_TOKEN }}
          JETRA_CHAT_ID: ${{ secrets.JETRA_CHAT_ID }}
        run: node scripts/cleanup_published_retention.cjs

      - name: Persist Telegram retention state
        if: ${{ always() && github.event_name != 'pull_request' && hashFiles('state/telegram-published.json') != '' }}
        run: bash scripts/persist_state_file.sh state/telegram-published.json "Record Telegram retention cleanup"

      - name: Persist Bale retention state
        if: ${{ always() && github.event_name != 'pull_request' && hashFiles('state/bale-published.json') != '' }}
        run: bash scripts/persist_state_file.sh state/bale-published.json "Record Bale retention cleanup"

      - name: Persist Rubika retention state
        if: ${{ always() && github.event_name != 'pull_request' && hashFiles('state/rubika-published.json') != '' }}
        run: bash scripts/persist_state_file.sh state/rubika-published.json "Record Rubika retention cleanup"

      - name: Persist Eitaa retention state
        if: ${{ always() && github.event_name != 'pull_request' && hashFiles('state/eitaa-published.json') != '' }}
        run: bash scripts/persist_state_file.sh state/eitaa-published.json "Record Eitaa retention cleanup"

      - name: Persist Jetra retention state
        if: ${{ always() && github.event_name != 'pull_request' && hashFiles('state/jetra-published.json') != '' }}
        run: bash scripts/persist_state_file.sh state/jetra-published.json "Record Jetra retention cleanup"
