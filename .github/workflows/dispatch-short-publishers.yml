name: Dispatch scheduled Filo and Rubika publishers

on:
  schedule:
    # Filo: every 30 minutes at :07 and :37 UTC.
    - cron: "7,37 * * * *"
    # Rubika: every 30 minutes, staggered 15 minutes after Filo.
    - cron: "22,52 * * * *"

permissions:
  actions: write

concurrency:
  group: goushibaaz-publisher-dispatcher
  cancel-in-progress: false

jobs:
  dispatch-filo:
    if: github.event.schedule == '7,37 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch Filo publisher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/publish-approved-video-to-filo.yml/dispatches" \
            --data '{"ref":"main"}')"
          if [ "$status" != "204" ]; then
            cat "$response_file"
            echo "Filo workflow dispatch failed with HTTP $status"
            exit 1
          fi
          echo "Filo publisher dispatch accepted by GitHub."

  dispatch-rubika:
    if: github.event.schedule == '22,52 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch Rubika publisher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/publish-approved-video-to-rubika.yml/dispatches" \
            --data '{"ref":"main"}')"
          if [ "$status" != "204" ]; then
            cat "$response_file"
            echo "Rubika workflow dispatch failed with HTTP $status"
            exit 1
          fi
          echo "Rubika publisher dispatch accepted by GitHub."
