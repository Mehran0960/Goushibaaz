name: Synchronized adaptive short-video publisher scheduler

on:
  schedule:
    # GitHub polls every five minutes; the persisted cadence decides whether all publishers start.
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
  # Push/manual events only report capacity diagnostics; they never publish.
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-short-publishers.yml"
      - "scripts/synchronized_scheduler.cjs"

permissions:
  actions: write
  contents: read

concurrency:
  group: goushibaaz-synchronized-publisher-scheduler
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Restore scheduler state
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: .scheduler-state
          key: goushibaaz-publisher-schedule-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            goushibaaz-publisher-schedule-

      - name: Evaluate quota, video availability, and dispatch all enabled platforms together
        id: tick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/synchronized_scheduler.cjs

      - name: Save scheduler state only when updated
        if: always() && steps.tick.outputs.state_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .scheduler-state
          key: goushibaaz-publisher-schedule-${{ github.run_id }}-${{ github.run_attempt }}
