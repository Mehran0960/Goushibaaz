name: Validate Filo native republisher

on:
  push:
    paths:
      - "scripts/filo_native_republish.cjs"
      - "scripts/test_filo_native_republish.cjs"
      - "scripts/google_trends_iran.cjs"
      - "scripts/test_google_trends_iran.cjs"
      - "scripts/score_filo_thumbnail.py"
      - "scripts/test_filo_thumbnail.py"
      - ".github/workflows/filo-native-republish.yml"
      - ".github/workflows/validate-filo-native-republish.yml"
  pull_request:
    paths:
      - "scripts/filo_native_republish.cjs"
      - "scripts/test_filo_native_republish.cjs"
      - "scripts/score_filo_thumbnail.py"
      - "scripts/test_filo_thumbnail.py"
      - ".github/workflows/filo-native-republish.yml"
      - ".github/workflows/validate-filo-native-republish.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Playwright and local face-landmark dependencies
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright >/dev/null
          python3 -m pip install --quiet --break-system-packages mediapipe==0.10.21
      - name: Syntax and deterministic policy tests
        run: |
          node --check scripts/filo_native_republish.cjs
          node --check scripts/test_filo_native_republish.cjs
          node scripts/test_filo_native_republish.cjs
          node --check scripts/google_trends_iran.cjs
          node --check scripts/test_google_trends_iran.cjs
          node scripts/test_google_trends_iran.cjs
          python3 -m py_compile scripts/score_filo_thumbnail.py scripts/test_filo_thumbnail.py
          python3 scripts/test_filo_thumbnail.py
