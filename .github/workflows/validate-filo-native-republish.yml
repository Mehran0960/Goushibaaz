name: Validate Filo native republisher

on:
  push:
    paths:
      - "scripts/filo_native_republish.cjs"
      - "scripts/test_filo_native_republish.cjs"
      - "scripts/filo_publish_cc0.cjs"
      - "scripts/filo_publication_cadence.cjs"
      - "scripts/filo_external_ingest_due.cjs"
      - "scripts/filo_url_import.cjs"
      - "scripts/test_filo_url_import.cjs"
      - "scripts/test_filo_publication_cadence.cjs"
      - "scripts/test_filo_external_ingest_due.cjs"
      - ".github/workflows/publish-approved-video-to-filo.yml"
      - ".github/workflows/filo-native-republish.yml"
      - "docs/FILO-INBOUND-INGESTION-ROADMAP.md"
      - "docs/FILO-NATIVE-REPUBLICATION.md"
      - "docs/CHANGELOG.md"
      - "scripts/quality_rank.cjs"
      - "scripts/test_quality_rank.cjs"
      - "scripts/editorial_content.cjs"
      - "scripts/test_editorial_content.cjs"
      - "scripts/trend_discovery.cjs"
      - "scripts/test_trend_discovery.cjs"
      - "config/content-policy.json"
      - "scripts/filo_global_search.cjs"
      - "scripts/filo_trend_search_worker.cjs"
      - "scripts/test_filo_global_search.cjs"
      - "scripts/test_filo_trend_search_worker.cjs"
      - ".github/workflows/filo-native-republish.yml"
      - ".github/workflows/validate-filo-native-republish.yml"
  pull_request:
    paths:
      - "scripts/filo_native_republish.cjs"
      - "scripts/test_filo_native_republish.cjs"
      - "scripts/filo_publish_cc0.cjs"
      - "scripts/filo_publication_cadence.cjs"
      - "scripts/filo_external_ingest_due.cjs"
      - "scripts/filo_url_import.cjs"
      - "scripts/test_filo_url_import.cjs"
      - "scripts/test_filo_publication_cadence.cjs"
      - "scripts/test_filo_external_ingest_due.cjs"
      - ".github/workflows/publish-approved-video-to-filo.yml"
      - ".github/workflows/filo-native-republish.yml"
      - "docs/FILO-INBOUND-INGESTION-ROADMAP.md"
      - "docs/FILO-NATIVE-REPUBLICATION.md"
      - "docs/CHANGELOG.md"
      - "scripts/quality_rank.cjs"
      - "scripts/test_quality_rank.cjs"
      - "scripts/editorial_content.cjs"
      - "scripts/test_editorial_content.cjs"
      - "scripts/trend_discovery.cjs"
      - "scripts/test_trend_discovery.cjs"
      - "config/content-policy.json"
      - "scripts/filo_global_search.cjs"
      - "scripts/filo_trend_search_worker.cjs"
      - "scripts/test_filo_global_search.cjs"
      - "scripts/test_filo_trend_search_worker.cjs"
      - ".github/workflows/filo-native-republish.yml"
      - ".github/workflows/validate-filo-native-republish.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Validate the Filo publishers and shared cadence
        run: |
          node --check scripts/filo_native_republish.cjs
          node --check scripts/filo_publish_cc0.cjs
          node --check scripts/filo_publication_cadence.cjs
          node --check scripts/filo_external_ingest_due.cjs
          node --check scripts/filo_url_import.cjs
          node --check scripts/test_filo_url_import.cjs
          node scripts/test_filo_url_import.cjs
          node --check scripts/test_filo_publication_cadence.cjs
          node --check scripts/test_filo_external_ingest_due.cjs
          node scripts/test_filo_native_republish.cjs
          node scripts/test_filo_publication_cadence.cjs
          node scripts/test_filo_external_ingest_due.cjs
          node --check scripts/quality_rank.cjs
          node --check scripts/editorial_content.cjs
          node --check scripts/trend_discovery.cjs
          node --check scripts/test_quality_rank.cjs
          node --check scripts/test_editorial_content.cjs
          node --check scripts/test_trend_discovery.cjs
          node scripts/test_quality_rank.cjs
          node scripts/test_editorial_content.cjs
          node scripts/test_trend_discovery.cjs
          node --check scripts/filo_global_search.cjs
          node --check scripts/filo_trend_search_worker.cjs
          node --check scripts/test_filo_global_search.cjs
          node --check scripts/test_filo_trend_search_worker.cjs
          node scripts/test_filo_global_search.cjs
          node scripts/test_filo_trend_search_worker.cjs
