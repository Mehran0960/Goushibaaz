name: Sync Goushibaaz trend scout YouTube credential

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sync-youtube-key:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate repository secret and sync it through GitHub OIDC
        uses: actions/github-script@v7
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        with:
          script: |
            const apiKey = process.env.YOUTUBE_API_KEY || "";
            if (!apiKey) {
              core.setFailed("YOUTUBE_API_KEY is missing from GitHub Actions repository secrets.");
              return;
            }

            const identityToken = await core.getIDToken("goushibaaz-trend-scout");
            const response = await fetch(
              "https://goushibaaz-trend-scout.m-hoseyni-6966.workers.dev/actions/sync-youtube-key",
              {
                method: "POST",
                headers: {
                  authorization: `Bearer ${identityToken}`,
                  "content-type": "application/json",
                  accept: "application/json"
                },
                body: JSON.stringify({ apiKey })
              }
            );
            const result = await response.json().catch(() => ({}));
            if (!response.ok || result.ok !== true || !result.scan || result.scan.ok !== true) {
              core.setFailed(
                "Credential sync or initial trend scan failed: " +
                String(result.error || result.scan?.error || result.scan?.status || "unknown error")
              );
              return;
            }

            core.info(
              "YouTube API key accepted and stored encrypted. Initial scan saved " +
              String(result.scan.scanned) + " candidates; emerging: " +
              String(result.scan.emerging) + "."
            );
