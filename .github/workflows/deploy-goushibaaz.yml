name: Deploy Goushibaaz trend scout

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          command: d1 migrations apply goushibaaz-trend-db --remote
      - name: Sync YouTube API key to the deployed Worker without logging its value
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::error::YOUTUBE_API_KEY is missing from GitHub Actions repository secrets; the Cloudflare scout cannot run."
            exit 1
          fi
          printf '%s' "$YOUTUBE_API_KEY" | npx --yes wrangler@4 secret put YOUTUBE_API_KEY --config cloudflare/wrangler.jsonc
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          command: deploy
