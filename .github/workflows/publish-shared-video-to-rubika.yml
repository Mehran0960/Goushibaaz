name: Publish Shared Video to Rubika
on:
  workflow_run:
    workflows: ["Prepare Shared Licensed Short Video"]
    types: [completed]
    branches: [main]
permissions:
  actions: read
  contents: write
concurrency:
  group: goushibaaz-rubika-destination
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the exact shared candidate artifact
        id: artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: goushibaaz-shared-candidate
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: work/shared-publish
      - name: Validate and independently publish to Rubika
        if: steps.artifact.outcome == 'success'
        env:
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
          RUBIKA_CHAT_ID: ${{ secrets.RUBIKA_CHAT_ID }}
          GOUSHIBAAZ_PUBLIC_PUBLISH_ENABLED: "true"
          GOUSHIBAAZ_FIRST_PUBLICATION_APPROVED: "true" # explicitly opened by the channel owner
        run: |
          node --check scripts/rubika_publish_shared.cjs
          node scripts/rubika_publish_shared.cjs
      - name: Persist Rubika-only publication state
        if: ${{ always() && steps.artifact.outcome == 'success' && hashFiles('state/rubika-published.json') != '' }}
        run: bash scripts/persist_state_file.sh state/rubika-published.json "Record Rubika destination result"
