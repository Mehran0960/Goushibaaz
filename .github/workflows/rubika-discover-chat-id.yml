name: Discover Rubika chat IDs (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goushibaaz-rubika-chat-id-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read recent Rubika updates and print chat IDs only
        env:
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
        run: |
          node <<'NODE'
          const token = process.env.RUBIKA_BOT_TOKEN || '';
          if (!token) {
            console.error('RUBIKA_CHAT_ID_DISCOVERY_FAILED: missing GitHub Actions secret RUBIKA_BOT_TOKEN');
            process.exit(1);
          }

          async function main() {
            const response = await fetch(
              'https://botapi.rubika.ir/v3/' + encodeURIComponent(token) + '/getUpdates',
              {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ limit: 20 }),
                signal: AbortSignal.timeout(20000)
              }
            );
            const raw = await response.text();
            let result;
            try { result = JSON.parse(raw); }
            catch { throw new Error('Rubika returned a non-JSON response (HTTP ' + response.status + ').'); }

            if (!response.ok || (result.status && result.status !== 'OK')) {
              const safeError = result.description || result.error || result.status || ('HTTP ' + response.status);
              throw new Error('getUpdates failed: ' + String(safeError).slice(0, 180));
            }

            const updates = result.data?.updates ?? result.updates ?? [];
            if (!Array.isArray(updates) || updates.length === 0) {
              console.log('NO_UPDATES_FOUND');
              console.log('Next: start the bot in a private chat and send /start; for a channel, add the bot as an admin, enable receiving all channel/group messages in Rubika BotFather if needed, publish a fresh test post, then rerun this workflow.');
              return;
            }

            const chats = new Map();
            for (const update of updates) {
              const chatId = update?.chat_id ?? update?.new_message?.chat_id ?? update?.inline_message?.chat_id;
              if (!chatId) continue;
              const id = String(chatId);
              const kind = id.startsWith('c0') ? 'channel' :
                           id.startsWith('g0') ? 'group' :
                           id.startsWith('b0') ? 'private-chat' : 'unknown';
              const previous = chats.get(id) || { chatId: id, kind, updateTypes: new Set() };
              previous.updateTypes.add(String(update.type || 'unknown'));
              chats.set(id, previous);
            }

            if (chats.size === 0) {
              console.log('UPDATES_FOUND_BUT_NO_CHAT_IDS');
              console.log('Rubika returned updates without a recognizable chat_id field. Only metadata was inspected; message text and tokens were not logged.');
              console.log('UPDATE_TYPES', JSON.stringify(updates.map(u => String(u?.type || 'unknown'))));
              return;
            }

            console.log('CHAT_IDS_FOUND (copy the chatId for your destination channel; channel IDs commonly begin with c0):');
            for (const entry of chats.values()) {
              console.log(JSON.stringify({
                chatId: entry.chatId,
                kind: entry.kind,
                updateTypes: Array.from(entry.updateTypes)
              }));
            }
            console.log('PRIVACY: update text, sender IDs, and bot token were not logged.');
          }

          main().catch(error => {
            console.error('RUBIKA_CHAT_ID_DISCOVERY_FAILED', String(error.message || error).slice(0, 220));
            process.exit(1);
          });
          NODE
