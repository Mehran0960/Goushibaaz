name: One-time Rubika chat ID test

on:
  push:
    paths:
      - ".github/workflows/rubika-chatid-test.yml"

permissions:
  contents: read

jobs:
  test-chat-id:
    if: contains(github.event.head_commit.message, 'RUN_RUBIKA_CHAT_ID_TEST')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send one test message to the configured Rubika chat
        env:
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
          RUBIKA_CHAT_ID: ${{ secrets.RUBIKA_CHAT_ID }}
        run: |
          node <<'NODE'
          const token = process.env.RUBIKA_BOT_TOKEN || '';
          const chatId = process.env.RUBIKA_CHAT_ID || '';
          if (!token || !chatId) {
            console.error('RUBIKA_CHAT_ID_TEST_FAILED: missing token or chat ID secret');
            process.exit(1);
          }
          const base = 'https://botapi.rubika.ir/v3/' + encodeURIComponent(token);
          async function call(method, body) {
            const response = await fetch(base + '/' + method, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify(body || {}),
              signal: AbortSignal.timeout(20000)
            });
            const raw = await response.text();
            let data;
            try { data = JSON.parse(raw); } catch { data = { raw: raw.slice(0, 200) }; }
            if (!response.ok || data.status !== 'OK') {
              console.error('RUBIKA_API_ERROR', JSON.stringify({
                method,
                httpStatus: response.status,
                status: data.status || 'unknown',
                error: data.description || data.error || 'request_failed'
              }));
              process.exit(1);
            }
            return data;
          }
          (async () => {
            await call('getMe');
            const result = await call('sendMessage', {
              chat_id: chatId,
              text: 'گوشی‌باز: پیام آزمایشی اتصال روبیکا. این پیام فقط برای بررسی Chat ID ارسال شده است.'
            });
            const msg = result.data?.message || result.data || {};
            console.log('RUBIKA_CHAT_ID_TEST_ACCEPTED', JSON.stringify({
              messageId: msg.message_id || msg.id || null
            }));
          })().catch(error => {
            console.error('RUBIKA_CHAT_ID_TEST_FAILED', String(error.message || error).slice(0, 200));
            process.exit(1);
          });
          NODE
