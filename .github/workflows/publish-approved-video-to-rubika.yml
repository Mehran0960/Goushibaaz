name: Scheduled Rubika Shorts publisher

on:
  workflow_dispatch:
  schedule:
    # Independent from Filo: offset by 30 minutes within each three-hour cycle.
    - cron: "43 */3 * * *"

permissions:
  contents: write

concurrency:
  group: goushibaaz-rubika-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Validate Rubika publisher
        run: node --check scripts/rubika_publish_cc0.cjs

      - name: Discover, validate rights, convert and publish an eligible vertical short to Rubika
        env:
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
        run: node scripts/rubika_publish_cc0.cjs

      - name: Persist Rubika publication state independently from Filo
        if: always()
        run: |
          if [ -f state/rubika-published.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/rubika-published.json
            if ! git diff --cached --quiet; then
              git commit -m "Record Rubika publication result"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
