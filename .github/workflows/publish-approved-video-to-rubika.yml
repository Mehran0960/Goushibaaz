name: Scheduled Rubika Shorts publisher

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goushibaaz-rubika-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Validate Rubika publisher
        run: node --check scripts/rubika_publish_cc0.cjs

      - name: Discover, validate rights, convert and publish an eligible vertical short to Rubika
        env:
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
        run: node scripts/rubika_publish_cc0.cjs

      - name: Persist Rubika publication state independently from Filo
        if: always()
        run: |
          if [ -f state/rubika-published.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/rubika-published.json
            if ! git diff --cached --quiet; then
              git commit -m "Record Rubika publication result"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
