name: Publish approved CC0 video to Filo (lazy uploader/auth diagnostics)

on:
  workflow_dispatch:
  schedule:
    # Eight daily slots, approximately one every three hours (UTC).
    - cron: "13 */3 * * *"

permissions:
  contents: write

concurrency:
  group: filo-publish-approved-video
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser and video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          npm init -y >/dev/null
          npm install --no-save playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node --check scripts/filo_publish_cc0.cjs

      - name: Verify CC0 source, prepare vertical MP4, and publish on Filo (fixed UI callback)
        env:
          FILO_USER: ${{ secrets.FILO_USER }}
          FILO_PASS: ${{ secrets.FILO_PASS }}
        run: node scripts/filo_publish_cc0.cjs

      - name: Commit publication result for idempotency, including unconfirmed submissions
        if: always()
        run: |
          if [ -f state/filo-published.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/filo-published.json
            if ! git diff --cached --quiet; then
              git commit -m "Record Filo publication result"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
