name: Scheduled verified-license short-video publisher for Filo

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *" # five-minute best-effort attempts; job runtime and Filo review can extend the actual gap
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-approved-video-to-filo.yml"
      - "scripts/filo_publish_cc0.cjs"
      - "scripts/pexels_source.cjs"
      - "scripts/filo_endcard.cjs"
      - "scripts/quality_rank.cjs"
      - "scripts/trend_discovery.cjs"
      - "config/content-policy.json"

permissions:
  contents: write

concurrency:
  group: filo-publish-approved-video
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install browser and video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
          npm init -y >/dev/null
          npm install --no-save playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node --check scripts/filo_publish_cc0.cjs
          node --check scripts/pexels_source.cjs
          node --check scripts/editorial_content.cjs
          node --check scripts/filo_endcard.cjs
          node scripts/test_editorial_content.cjs
          node scripts/test_filo_endcard.cjs

      - name: Find a trend-led video with verified reuse rights, prepare 720p vertical video and cover, publish to Filo
        env:
          FILO_USER: ${{ secrets.FILO_USER }}
          FILO_PASS: ${{ secrets.FILO_PASS }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY || vars.PEXELS_API_KEY }}
        run: node scripts/filo_publish_cc0.cjs

      - name: Persist publication result for idempotency, including unconfirmed submissions
        if: always()
        run: bash scripts/persist_state_file.sh state/filo-published.json "Record Filo publication result"
