name: Probe MediaFarsi public Shorts rendering

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe-mediafarsi-shorts.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Inspect public rendered Shorts lists
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage();
            page.setDefaultTimeout(12000);
            page.on('response', response => {
              const u=response.url();
              if (/api|short|channel|video|graphql|ajax/i.test(u) && !/google|analytics|pushstorm/i.test(u)) {
                console.log('NETWORK_MATCH', response.status(), u.split('?')[0].slice(0,300));
              }
            });
            const urls=[
              'https://mediafarsi.com/shorts',
              'https://mediafarsi.com/channel/memento-studios?tab=shorts',
              'https://mediafarsi.com/channel/memento-studios',
              'https://mediafarsi.com/channel/mikikalafe?tab=shorts',
              'https://mediafarsi.com/channel/mehdi-jahaan?tab=shorts'
            ];
            for (const url of urls) {
              try {
                await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
                await page.waitForTimeout(4500);
                const data=await page.evaluate(()=>({
                  title:document.title,
                  url:location.href,
                  body:document.body.innerText.slice(0,2200),
                  links:[...document.querySelectorAll('a[href]')].filter(a=>/short|video|watch|youtube/i.test(a.getAttribute('href')||'')).slice(0,90).map(a=>({
                    href:a.href.split('?')[0],
                    text:(a.innerText||'').trim().replace(/\\s+/g,' ').slice(0,220),
                    parent:(a.parentElement?.parentElement?.innerText||'').trim().replace(/\\s+/g,' ').slice(0,260),
                    cls:typeof a.className==='string'?a.className:'',
                    outer:a.outerHTML.slice(0,500)
                  })),
                  cards:[...document.querySelectorAll('[class*="short"],[class*="video"],[data-id]')].filter(el=>{
                    const t=(el.innerText||'').trim(); return t.length>25 && t.length<450 && /بازدید|views|پیش/.test(t);
                  }).slice(0,35).map(el=>({tag:el.tagName,cls:typeof el.className==='string'?el.className:'',id:el.id||'',text:(el.innerText||'').trim().replace(/\\s+/g,' ').slice(0,400),outer:el.outerHTML.slice(0,700)}))
                }));
                console.log('PAGE_RESULT',JSON.stringify(data));
              } catch(e) {
                console.log('PAGE_ERROR',url,String(e.message||e).slice(0,240));
              }
            }
            await browser.close();
          })().catch(e=>{console.error('PROBE_FAILED',e);process.exit(1)});
          NODE
