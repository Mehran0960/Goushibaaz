name: Temporary Rubika end-to-end publish validation

on:
  push:
    paths:
      - "scripts/rubika_publish_cc0.cjs"

permissions:
  contents: write

concurrency:
  group: goushibaaz-rubika-e2e-validation
  cancel-in-progress: false

jobs:
  publish-test:
    if: contains(github.event.head_commit.message, 'RUN_RUBIKA_REAL_PUBLISH_TEST')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Validate Rubika publisher syntax
        run: node --check scripts/rubika_publish_cc0.cjs
      - name: Publish one eligible vertical short to the verified Rubika channel
        env:
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
          DRY_RUN: "false"
        run: node scripts/rubika_publish_cc0.cjs
      - name: Persist publication state to prevent duplicate publishing
        if: always()
        run: |
          if [ -f state/rubika-published.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/rubika-published.json
            if ! git diff --cached --quiet; then
              git commit -m "Record Rubika publication result"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
