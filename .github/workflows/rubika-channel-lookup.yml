name: One-time Rubika channel lookup

on:
  push:
    paths:
      - ".github/workflows/rubika-channel-lookup.yml"

permissions:
  contents: read

jobs:
  lookup-channel:
    if: contains(github.event.head_commit.message, 'RUN_RUBIKA_CHAT_LOOKUP')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Look up the public channel without posting
        env:
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
        run: |
          node <<'NODE'
          const token = process.env.RUBIKA_BOT_TOKEN || '';
          if (!token) {
            console.error('RUBIKA_LOOKUP_FAILED: missing RUBIKA_BOT_TOKEN');
            process.exit(1);
          }
          const base = 'https://botapi.rubika.ir/v3/' + encodeURIComponent(token);
          async function call(method, body) {
            const response = await fetch(base + '/' + method, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify(body || {}),
              signal: AbortSignal.timeout(20000)
            });
            const raw = await response.text();
            let data;
            try { data = JSON.parse(raw); } catch { data = { raw: raw.slice(0, 200) }; }
            console.log('RUBIKA_LOOKUP_RESPONSE', JSON.stringify({
              method, httpStatus: response.status,
              status: data.status || 'unknown',
              error: data.description || data.error || null
            }));
            if (!response.ok || data.status !== 'OK') return null;
            return data.data || data;
          }
          (async () => {
            await call('getMe');
            const data = await call('getChat', { chat_id: '@didobyn' });
            if (!data) {
              console.log('RUBIKA_CHANNEL_LOOKUP_RESULT: getChat did not resolve @didobyn; no message was sent.');
              return;
            }
            const chat = data.chat || data;
            console.log('RUBIKA_CHANNEL_LOOKUP_RESULT', JSON.stringify({
              chatId: chat.chat_id || chat.id || chat.guid || null,
              type: chat.type || chat.chat_type || null,
              title: chat.title || chat.name || null,
              username: chat.username || null,
              canSendMessages: chat.can_send_messages ?? null
            }));
          })().catch(error => {
            console.error('RUBIKA_LOOKUP_FAILED', String(error.message || error).slice(0, 200));
            process.exit(1);
          });
          NODE
