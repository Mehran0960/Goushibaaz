name: Filo cadence watchdog

on:
  workflow_run:
    workflows:
      - Filo native authorized republisher
      - Filo exhaustive Google Trends search worker
    types: [completed]
  # Recovery checks only; normal continuation is event-driven.
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  continue-native:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Filo native authorized republisher' && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: filo-cadence-continue-native
      cancel-in-progress: true
    steps:
      - name: Continue publisher ten minutes after the preceding cycle started
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_STARTED_AT"
          started_epoch="$(date -u -d "$SOURCE_STARTED_AT" +%s)"
          now_epoch="$(date -u +%s)"
          remaining=$((600 - (now_epoch - started_epoch)))
          if (( remaining > 0 )); then
            echo "Waiting $remaining seconds to preserve the ten-minute start interval."
            sleep "$remaining"
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"main"}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/filo-native-republish.yml/dispatches"

  continue-trend-search:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Filo exhaustive Google Trends search worker' && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: filo-cadence-continue-trend-search
      cancel-in-progress: true
    steps:
      - name: Continue trend search twenty minutes after the preceding cycle started
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_STARTED_AT"
          started_epoch="$(date -u -d "$SOURCE_STARTED_AT" +%s)"
          now_epoch="$(date -u +%s)"
          remaining=$((1200 - (now_epoch - started_epoch)))
          if (( remaining > 0 )); then
            echo "Waiting $remaining seconds to preserve the twenty-minute search interval."
            sleep "$remaining"
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"main"}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/filo-trend-search.yml/dispatches"

  recover-native:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: filo-cadence-recover-native
      cancel-in-progress: true
    steps:
      - name: Dispatch publisher only when no recent cycle exists
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_AGE_SECONDS: "720"
        run: |
          set -euo pipefail
          runs="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/filo-native-republish.yml/runs?branch=main&per_page=1")"
          started="$(jq -r '.workflow_runs[0].run_started_at // empty' <<< "$runs")"
          if [[ -n "$started" ]]; then
            age=$(( $(date -u +%s) - $(date -u -d "$started" +%s) ))
            if (( age < MIN_AGE_SECONDS )); then
              echo "Publisher heartbeat is recent ($age seconds); recovery dispatch not needed."
              exit 0
            fi
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"main"}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/filo-native-republish.yml/dispatches"

  recover-trend-search:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: filo-cadence-recover-trend-search
      cancel-in-progress: true
    steps:
      - name: Dispatch trend search only when no recent cycle exists
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_AGE_SECONDS: "1320"
        run: |
          set -euo pipefail
          runs="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/filo-trend-search.yml/runs?branch=main&per_page=1")"
          started="$(jq -r '.workflow_runs[0].run_started_at // empty' <<< "$runs")"
          if [[ -n "$started" ]]; then
            age=$(( $(date -u +%s) - $(date -u -d "$started" +%s) ))
            if (( age < MIN_AGE_SECONDS )); then
              echo "Trend-search heartbeat is recent ($age seconds); recovery dispatch not needed."
              exit 0
            fi
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"main"}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/filo-trend-search.yml/dispatches"
