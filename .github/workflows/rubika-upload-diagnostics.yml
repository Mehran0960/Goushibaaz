name: Temporary Rubika upload transport diagnostics

on:
  push:
    paths:
      - ".github/workflows/rubika-upload-diagnostics.yml"

permissions:
  contents: read

jobs:
  upload-diagnostic:
    if: contains(github.event.head_commit.message, 'RUN_RUBIKA_UPLOAD_DIAGNOSTIC')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Probe Rubika video file upload without publishing
        env:
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
        run: |
          set -e
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i testsrc2=size=1080x1920:rate=30 \
            -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 \
            -t 10 -c:v libx264 -preset veryfast -crf 28 -pix_fmt yuv420p \
            -c:a aac -b:a 64k -ac 2 -movflags +faststart /tmp/rubika-upload-probe.mp4
          node <<'NODE'
          const fs = require('node:fs');
          const token = process.env.RUBIKA_BOT_TOKEN || '';
          if (!token) throw new Error('missing_bot_token');
          const base = 'https://botapi.rubika.ir/v3/' + encodeURIComponent(token);
          async function api(method, body) {
            const response = await fetch(base + '/' + method, {
              method: 'POST', headers: { 'content-type': 'application/json' },
              body: JSON.stringify(body || {}), signal: AbortSignal.timeout(20000)
            });
            const raw = await response.text();
            let data;
            try { data = JSON.parse(raw); } catch { throw new Error(method + '_non_json_http_' + response.status); }
            if (!response.ok || data.status !== 'OK') {
              throw new Error(method + '_failed_http_' + response.status + '_status_' + String(data.status || 'unknown'));
            }
            return data.data || data;
          }
          (async () => {
            await api('getMe');
            const requested = await api('requestSendFile', { type: 'File' });
            const uploadUrl = requested.upload_url || requested.data?.upload_url;
            if (!uploadUrl) throw new Error('requestSendFile_missing_upload_url');
            const u = new URL(uploadUrl);
            console.log('RUBIKA_UPLOAD_ENDPOINT', JSON.stringify({ protocol: u.protocol, hostname: u.hostname, filenameBytes: fs.statSync('/tmp/rubika-upload-probe.mp4').size }));
            const form = new FormData();
            form.append('file', new Blob([fs.readFileSync('/tmp/rubika-upload-probe.mp4')], { type: 'video/mp4' }), 'probe.mp4');
            let response;
            try {
              response = await fetch(uploadUrl, { method: 'POST', body: form, signal: AbortSignal.timeout(30000) });
            } catch (error) {
              console.error('RUBIKA_UPLOAD_TRANSPORT_FAILED', String(error.message || error).slice(0, 160));
              process.exit(2);
            }
            const raw = await response.text();
            let data;
            try { data = JSON.parse(raw); } catch { data = {}; }
            const fileId = data.data?.file_id || data.file_id || data.data?.file?.file_id;
            console.log('RUBIKA_UPLOAD_RESPONSE', JSON.stringify({
              httpStatus: response.status,
              status: data.status || null,
              fileIdReceived: Boolean(fileId),
              responseContentType: response.headers.get('content-type') || null
            }));
            if (!response.ok || !fileId) process.exit(3);
          })().catch(error => {
            console.error('RUBIKA_UPLOAD_DIAGNOSTIC_FAILED', String(error.message || error).slice(0, 180));
            process.exit(1);
          });
          NODE
