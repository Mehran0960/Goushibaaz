name: Prepare Shared Licensed Short Video
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/rubika_publish_cc0.cjs"
      - "scripts/quality_rank.cjs"
      - "scripts/media_format.cjs"
      - "scripts/editorial_content.cjs"
      - "scripts/test_editorial_content.cjs"
      - "scripts/pexels_source.cjs"
      - "scripts/test_pexels_source.cjs"
      - "config/content-policy.json"
      - "scripts/rubika_publish_shared.cjs"
      - "scripts/platform_publish.cjs"
      - "scripts/telegram_publish.cjs"
      - "scripts/bale_publish.cjs"
      - "scripts/persist_state_file.sh"
      - ".github/workflows/prepare-shared-video.yml"
permissions:
  contents: write
  actions: write
concurrency:
  group: goushibaaz-shared-video-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Validate shared preparation and editorial selection
        run: |
          node --check scripts/rubika_publish_cc0.cjs
          node --check scripts/pexels_source.cjs
          node --check scripts/filo_endcard.cjs
          node --check scripts/media_format.cjs
          node --check scripts/editorial_content.cjs
          node scripts/test_media_format.cjs
          node scripts/test_editorial_content.cjs
          node scripts/test_pexels_source.cjs
      - name: Check Pexels credential availability without exposing its value
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY || vars.PEXELS_API_KEY }}
        run: |
          if [ -n "$PEXELS_API_KEY" ]; then
            echo "PEXELS_REPOSITORY_CREDENTIAL_PRESENT=true"
          else
            echo "PEXELS_REPOSITORY_CREDENTIAL_PRESENT=false; Pexels discovery will be skipped."
          fi
      - name: Discover, verify rights and prepare one shared vertical video
        env:
          PREPARE_ONLY: "true"
          DRY_RUN: "true"
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY || vars.PEXELS_API_KEY }}
        run: node scripts/rubika_publish_cc0.cjs
      - name: Upload the same prepared video and manifest for Telegram, Rubika and Bale
        id: shared_artifact
        if: ${{ success() && hashFiles('work/shared-publish/manifest.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: goushibaaz-shared-candidate
          path: work/shared-publish/*
          if-no-files-found: error
          retention-days: 2
      - name: Confirm an eligible shared candidate exists
        id: candidate
        if: ${{ success() && steps.shared_artifact.outcome == 'success' }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          let eligible = false;
          try {
            const manifest = JSON.parse(fs.readFileSync('work/shared-publish/manifest.json', 'utf8'));
            eligible = manifest.status === 'prepared' && fs.existsSync('work/shared-publish/video.mp4');
          } catch {}
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `eligible=${eligible ? 'true' : 'false'}\n`);
          console.log('SHARED_CANDIDATE_GATE', JSON.stringify({ eligible }));
          NODE

      - name: Dispatch Telegram, Bale and Rubika independently
        if: ${{ steps.candidate.outputs.eligible == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const token = process.env.GH_TOKEN;
          const repository = process.env.REPOSITORY;
          const sourceRunId = String(process.env.SOURCE_RUN_ID || '');
          const workflows = [
            'publish-shared-video-to-telegram.yml',
            'publish-shared-video-to-bale.yml',
            'publish-shared-video-to-rubika.yml'
          ];
          async function dispatch(workflow) {
            try {
              const response = await fetch(`https://api.github.com/repos/${repository}/actions/workflows/${workflow}/dispatches`, {
                method: 'POST',
                headers: {
                  accept: 'application/vnd.github+json',
                  authorization: `Bearer ${token}`,
                  'content-type': 'application/json',
                  'x-github-api-version': '2022-11-28'
                },
                body: JSON.stringify({ ref: 'main', inputs: { source_run_id: sourceRunId } })
              });
              if (response.status === 204) return { workflow, ok: true, status: 204 };
              return { workflow, ok: false, status: response.status, error: (await response.text()).slice(0, 240) };
            } catch (error) {
              return { workflow, ok: false, status: 0, error: String(error && error.message || error).slice(0, 240) };
            }
          }
          const results = await Promise.all(workflows.map(dispatch));
          for (const result of results) {
            const line = `${result.ok ? 'DISPATCH_ACCEPTED' : 'DISPATCH_DEFERRED'} ${JSON.stringify(result)}`;
            console.log(line);
            await require('node:fs').promises.appendFile(process.env.GITHUB_STEP_SUMMARY, line + '\n');
          }
          if (results.some(result => !result.ok)) process.exitCode = 1;
          NODE
      - name: Persist shared deduplication and preparation outcome
        if: ${{ always() && hashFiles('state/shared-publications.json') != '' }}
        run: bash scripts/persist_state_file.sh state/shared-publications.json "Record shared licensed video preparation"
