name: Publish Shared Video to Telegram
on:
  workflow_run:
    workflows: ["Prepare Shared Licensed Short Video"]
    types: [completed]
    branches: [main]
permissions:
  actions: read
  contents: write
concurrency:
  group: goushibaaz-telegram-destination
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the exact shared candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: goushibaaz-shared-candidate
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: work/shared-publish
      - name: Validate and independently publish to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOUSHIBAAZ_PUBLIC_PUBLISH_ENABLED: "true"
          GOUSHIBAAZ_FIRST_PUBLICATION_APPROVED: "true" # explicitly opened by the channel owner
        run: |
          node --check scripts/platform_publish.cjs
          node --check scripts/telegram_publish.cjs
          node scripts/telegram_publish.cjs
      - name: Persist Telegram-only publication state
        if: ${{ always() && hashFiles('state/telegram-published.json') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/telegram-published.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Telegram destination result"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
